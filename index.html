<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Admin dashboard for FNB Stadium: vendors, kiosks, storage rooms and bays, loading crews and stock.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2060%2044%22%3E%3Crect%20width%3D%2260%22%20height%3D%2244%22%20fill%3D%22%23111%22/%3E%3Cpath%20d%3D%22M2%2030%20C%206%2012%2C%2022%206%2C%2038%2011%20C%2046%2013.5%2C%2053%2017%2C%2058%2021%20C%2051%2018.5%2C%2043%2016.5%2C%2035%2016%20C%2020%2015%2C%208%2019%2C%204%2032%20Z%22%20fill%3D%22%23e01b22%22/%3E%3C/svg%3E">
<title>FNB Stadium Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
>

<style>
  /*
   * FNB Stadium Admin.
   *
   * Brand: SMSA is a red swoosh over a heavy black wordmark on white. Red is
   * therefore spoken for — it is the identity, and it also has to mean "act
   * now" in an operations tool. The split: red belongs to the chrome (mark,
   * active nav, primary action) and to genuine alerts, and NEVER to a chart
   * series. Charts run on a separately validated blue/orange/aqua set, so a
   * red thing on this screen is always either the brand or a problem.
   */
  :root {
    color-scheme: light;

    --brand: #e01b22;
    --brand-deep: #b91419;
    --brand-ink: #ffffff;
    --brand-soft: #fdecec;
    --brand-line: #f6c9cb;

    --ink: #1b1b1d;            /* the wordmark black */
    --bar: #16171a;            /* top bar / rail — dark in both themes */
    --bar-text: #c9cbd0;
    --bar-dim: #74777e;

    --surface: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #fafbfc;
    --line: #e2e5ea;
    --line-strong: #c8cdd5;

    --text: #1b1b1d;
    --muted: #5d626b;
    --muted-2: #838995;

    /* Status — reserved, always shipped with a label. */
    --good: #127a4a;
    --good-soft: #e6f3ec;
    --warn: #8f5d00;
    --warn-soft: #fbf1dd;
    --crit: #b3201c;
    --crit-soft: #fbeaea;
    --info: #1d5b7e;
    --info-soft: #e8f1f6;

    /* Charts — validated categorical set (light steps). */
    --viz-1: #2a78d6;
    --viz-2: #eb6834;
    --viz-3: #1baf7a;
    --viz-grid: #e6e9ee;
    --viz-track: #eceff3;

    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;

    --r: 3px;
    --r-lg: 6px;
    --shadow: 0 1px 2px rgb(20 22 26 / 7%);
    --shadow-lg: 0 6px 20px rgb(20 22 26 / 12%), 0 1px 3px rgb(20 22 26 / 7%);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;

      --brand: #f3413f;
      --brand-deep: #d92b2c;
      --brand-ink: #1a0505;
      --brand-soft: #2c1414;
      --brand-line: #4d2020;

      --ink: #f0f1f3;
      --bar: #0e0f11;

      --surface: #131417;
      --panel: #1b1d21;
      --panel-2: #212429;
      --line: #2e3238;
      --line-strong: #444a52;

      --text: #eceef1;
      --muted: #969ca6;
      --muted-2: #7b818c;

      --good: #4cb583;
      --good-soft: #14291f;
      --warn: #d9a441;
      --warn-soft: #2a2114;
      --crit: #f0736e;
      --crit-soft: #2e1817;
      --info: #6fb0d4;
      --info-soft: #13242c;

      --viz-1: #3987e5;
      --viz-2: #d95926;
      --viz-3: #199e70;
      --viz-grid: #2b2f35;
      --viz-track: #24272c;

      --shadow: 0 1px 2px rgb(0 0 0 / 45%);
      --shadow-lg: 0 8px 26px rgb(0 0 0 / 55%);
    }
  }

  :root[data-theme='dark'] {
    color-scheme: dark;
    --brand: #f3413f;
    --brand-deep: #d92b2c;
    --brand-ink: #1a0505;
    --brand-soft: #2c1414;
    --brand-line: #4d2020;
    --ink: #f0f1f3;
    --bar: #0e0f11;
    --surface: #131417;
    --panel: #1b1d21;
    --panel-2: #212429;
    --line: #2e3238;
    --line-strong: #444a52;
    --text: #eceef1;
    --muted: #969ca6;
    --muted-2: #7b818c;
    --good: #4cb583;
    --good-soft: #14291f;
    --warn: #d9a441;
    --warn-soft: #2a2114;
    --crit: #f0736e;
    --crit-soft: #2e1817;
    --info: #6fb0d4;
    --info-soft: #13242c;
    --viz-1: #3987e5;
    --viz-2: #d95926;
    --viz-3: #199e70;
    --viz-grid: #2b2f35;
    --viz-track: #24272c;
    --shadow: 0 1px 2px rgb(0 0 0 / 45%);
    --shadow-lg: 0 8px 26px rgb(0 0 0 / 55%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; text-wrap: balance; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  /* ------------- brand bar ------------- */

  .topbar {
    background: var(--bar);
    padding: 0 18px;
    padding-top: env(safe-area-inset-top, 0px);
    display: flex; align-items: center; gap: 16px;
    height: calc(52px + env(safe-area-inset-top, 0px));
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid rgb(255 255 255 / 8%);
  }

  .lockup { display: flex; align-items: center; gap: 10px; flex: none; }
  .mark { width: 40px; height: 30px; flex: none; display: block; }
  .wordmark { line-height: 1; }
  .wordmark b {
    display: block; color: #fff; font-size: 16px; font-weight: 800;
    letter-spacing: 0.02em;
  }
  .wordmark span {
    display: block; color: var(--brand); font-family: var(--mono);
    font-size: 8px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.22em; margin-top: 2px;
  }

  .topDivider { width: 1px; height: 26px; background: rgb(255 255 255 / 13%); flex: none; }

  .venuePick {
    background: rgb(255 255 255 / 7%); color: #fff;
    border: 1px solid rgb(255 255 255 / 14%); border-radius: var(--r);
    padding: 5px 9px; font-size: 12.5px; font-weight: 600; max-width: 230px;
  }
  .venuePick option { background: #1b1d21; color: #fff; }

  .topRight { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .topNote { color: var(--bar-dim); font-size: 11px; font-family: var(--mono); }

  /* ------------- shell ------------- */

  .shell { display: grid; grid-template-columns: 198px 1fr; min-height: calc(100% - 52px); }

  .rail {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 13px 9px; position: sticky;
    top: calc(52px + env(safe-area-inset-top, 0px));
    height: calc(100vh - 52px); overflow-y: auto;
    display: flex; flex-direction: column;
  }

  .railLabel {
    color: var(--muted-2); font-family: var(--mono); font-size: 8.5px;
    text-transform: uppercase; letter-spacing: 0.14em; padding: 12px 9px 5px;
  }

  .railBtn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; padding: 6px 9px; border: 0;
    background: transparent; color: var(--muted); font-size: 13px;
    border-radius: var(--r); transition: background .1s, color .1s;
  }
  .railBtn:hover { background: var(--panel-2); color: var(--text); }
  .railBtn[aria-current='true'] {
    background: var(--brand-soft); color: var(--brand-deep); font-weight: 700;
    box-shadow: inset 2px 0 0 var(--brand);
  }
  .railBtn .n { font-family: var(--mono); font-size: 10px; opacity: .7; font-weight: 500; }

  .railFoot {
    margin-top: auto; padding: 11px 9px 0; border-top: 1px solid var(--line);
    color: var(--muted-2); font-size: 10.5px; line-height: 1.5;
  }

  .main { min-width: 0; padding: 18px 22px 64px; max-width: 1500px; }

  /* ------------- header ------------- */

  .head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; padding-bottom: 13px; margin-bottom: 15px;
    border-bottom: 1px solid var(--line);
  }
  .head h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; }
  .eyebrow {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--brand); font-weight: 600; margin-bottom: 4px;
  }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 5px; max-width: 72ch; }
  .headActions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  .sectionTitle {
    font-family: var(--mono); font-size: 9.5px; text-transform: uppercase;
    letter-spacing: 0.13em; color: var(--muted-2); margin: 22px 0 9px;
    display: flex; align-items: center; gap: 9px;
  }
  .sectionTitle::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  /* ------------- buttons ------------- */

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 5.5px 11px;
    border: 1px solid var(--line-strong); border-radius: var(--r);
    background: var(--panel); font-size: 12.5px; font-weight: 500;
    transition: background .1s, border-color .1s;
  }
  .btn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--muted-2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { padding: 3px 8px; font-size: 11.5px; }
  .btn.primary {
    background: var(--brand); border-color: var(--brand);
    color: var(--brand-ink); font-weight: 700;
  }
  .btn.primary:hover:not(:disabled) { background: var(--brand-deep); border-color: var(--brand-deep); }
  .btn.ghost { background: transparent; border-color: var(--line-strong); }
  .btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 34%, transparent); }
  .btn.danger:hover:not(:disabled) { background: var(--crit-soft); }

  /* ------------- panels ------------- */

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden;
  }
  .panelHead {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  .panelTitle { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
  .panelHint { color: var(--muted-2); font-size: 11px; font-family: var(--mono); }
  .panelBody { padding: 14px; }

  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gMain { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }

  /* ------------- KPI tiles ------------- */

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 11px; }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 12px 14px; box-shadow: var(--shadow); text-align: left; width: 100%;
    position: relative; overflow: hidden;
  }
  button.tile:hover { border-color: var(--brand); }
  .tileLabel {
    font-family: var(--mono); font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--muted-2);
  }
  .tileVal { font-size: 28px; font-weight: 800; line-height: 1.05; margin-top: 5px; letter-spacing: -0.035em; }
  .tileNote { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tileVal.good { color: var(--good); }
  .tileVal.warn { color: var(--warn); }
  .tileVal.crit { color: var(--crit); }

  /* ------------- tables ------------- */

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-family: var(--mono); font-size: 8.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-2);
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    background: var(--panel-2); white-space: nowrap;
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--panel-2); }
  .num { text-align: right; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .tight { width: 1%; white-space: nowrap; }
  .code { font-family: var(--mono); font-size: 11.5px; }
  .muted { color: var(--muted); }
  .tiny { font-size: 11px; }
  .strong { font-weight: 700; }
  .rowBtns { display: flex; gap: 5px; justify-content: flex-end; }

  /* ------------- pills ------------- */

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 1.5px 7px;
    border-radius: 2px; font-size: 10.5px; font-weight: 700; white-space: nowrap;
    border: 1px solid transparent; line-height: 1.6;
  }
  .p-neutral { background: var(--panel-2); border-color: var(--line-strong); color: var(--muted); }
  .p-good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 30%, transparent); color: var(--good); }
  .p-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); color: var(--warn); }
  .p-crit { background: var(--crit-soft); border-color: color-mix(in srgb, var(--crit) 32%, transparent); color: var(--crit); }
  .p-info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); color: var(--info); }
  .pill svg { width: 9px; height: 9px; flex: none; }

  /* ------------- charts ------------- */

  .chart { width: 100%; display: block; overflow: visible; }
  .chartRow { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .chartLabel { font-size: 12px; min-width: 116px; flex: none; }
  .chartTrack { flex: 1; height: 15px; background: var(--viz-track); border-radius: 2px; overflow: hidden; min-width: 40px; }
  .chartBar { height: 100%; border-radius: 0 2px 2px 0; }
  .chartVal { font-family: var(--mono); font-size: 11.5px; min-width: 66px; text-align: right; flex: none; }

  .legend { display: flex; gap: 13px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* ------------- empty / notices ------------- */

  .empty {
    padding: 42px 24px; text-align: center; background: var(--panel);
    border: 1px dashed var(--line-strong); border-radius: var(--r-lg);
  }
  .emptyTitle { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
  .emptyBody { color: var(--muted); font-size: 12.5px; max-width: 56ch; margin: 0 auto 15px; }

  .notice {
    padding: 9px 13px; border-left: 3px solid var(--brand); background: var(--brand-soft);
    font-size: 12.5px; border-radius: 0 var(--r) var(--r) 0;
  }
  .notice.crit { border-left-color: var(--crit); background: var(--crit-soft); }
  .notice.warn { border-left-color: var(--warn); background: var(--warn-soft); }
  .notice.info { border-left-color: var(--info); background: var(--info-soft); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    background: var(--bar); color: #f2f3f5; padding: 9px 16px;
    border-radius: var(--r); font-size: 12.5px; box-shadow: var(--shadow-lg);
    z-index: 60; max-width: min(460px, 92vw);
  }

  /* ------------- forms ------------- */

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 11px; }
  .search {
    padding: 5.5px 10px; border: 1px solid var(--line-strong); border-radius: var(--r);
    background: var(--panel); min-width: 200px; font-size: 12.5px;
  }
  .count { color: var(--muted-2); font-size: 11.5px; font-family: var(--mono); margin-left: auto; }

  .formWrap { margin-bottom: 13px; }
  .formHead {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .formBody {
    padding: 14px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  .field { display: grid; gap: 3px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label {
    font-family: var(--mono); font-size: 8.5px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted-2);
  }
  .field input, .field select, .field textarea {
    padding: 6px 9px; border: 1px solid var(--line-strong); border-radius: var(--r);
    background: var(--panel); font-size: 13px; width: 100%; min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 56px; font-family: inherit; }
  .field .hint { font-size: 10.5px; color: var(--muted-2); }
  .field.err input, .field.err select { border-color: var(--crit); }
  .field .errMsg { font-size: 10.5px; color: var(--crit); font-weight: 600; }

  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .check input { width: auto; }

  .formFoot {
    padding: 11px 14px; border-top: 1px solid var(--line);
    display: flex; gap: 7px; align-items: center; background: var(--panel-2);
  }

  /* ------------- assist ------------- */

  .assistOut {
    white-space: pre-wrap; font-size: 12.5px; line-height: 1.55;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px; max-height: 340px; overflow: auto;
  }
  .assistChips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

  /* ------------- venue cards ------------- */

  .venueGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
  .venueCard {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 0; box-shadow: var(--shadow); text-align: left; width: 100%; overflow: hidden;
  }
  .venueCard:hover { border-color: var(--brand); }
  .venueCard[aria-current='true'] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
  .venueStripe { height: 3px; background: var(--brand); }
  .venueBody { padding: 11px 13px; }
  .venueName { font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em; }
  .venueMeta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .venueCap { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; }
  .venueCapLabel { font-family: var(--mono); font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-2); }

  .dl { display: grid; grid-template-columns: minmax(104px, auto) 1fr; gap: 7px 15px; font-size: 12.5px; margin: 0; }
  .dl dt { color: var(--muted-2); font-family: var(--mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em; padding-top: 2px; }
  .dl dd { margin: 0; }

  .srcList { font-size: 11px; color: var(--muted); line-height: 1.6; }
  .srcList a { color: var(--info); }

  /* ------------- responsive ------------- */

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .rail {
      position: static; height: auto; padding: 9px 13px;
      border-right: 0; border-bottom: 1px solid var(--line);
      flex-direction: row; gap: 5px; overflow-x: auto; scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .railLabel, .railFoot { display: none; }
    .railGroup { display: contents; }
    .railBtn { flex: none; width: auto; white-space: nowrap; }
    .main { padding: 14px 13px 50px; }
    .gMain, .g2 { grid-template-columns: minmax(0, 1fr); }
    .count { margin-left: 0; }
    .topbar { padding: 0 13px; gap: 10px; }
    .venuePick { max-width: 150px; }
    .topNote { display: none; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<header class="topbar">
  <div class="lockup">
    <!-- The SMSA swoosh: a tapered wave rising left to right over the wordmark. -->
    <svg class="mark" viewBox="0 0 60 44" aria-hidden="true">
      <path
        d="M2 30 C 6 12, 22 6, 38 11 C 46 13.5, 53 17, 58 21 C 51 18.5, 43 16.5, 35 16 C 20 15, 8 19, 4 32 Z"
        fill="#e01b22"
      />
      <path d="M2 30 C 1 22, 2 16, 6 12 C 3 17, 2.5 23, 4 32 Z" fill="#b91419" />
    </svg>
    <span class="wordmark">
      <b>SMSA</b>
      <span>FNB Stadium</span>
    </span>
  </div>

  <div class="topDivider"></div>

      fields: [

      empty: 'Name the counters. Give each a code you would say over the radio — K-L1-014 carries level and number in four characters.',
      fields: [

        { k: 'name', label: 'Name', type: 'text', wide: true },
        { k: 'level', label: 'Level', type: 'select', options: LEVELS },

        { k: 'kind', label: 'Type', type: 'select', options: [['beverage', 'Bar / beverage'], ['food', 'Hot food'], ['combo', 'Food & drink'], ['coffee', 'Coffee'], ['merchandise', 'Merchandise'], ['premium', 'Suite service']] },

        { k: 'status', label: 'Status', type: 'select', options: [['active', 'Active'], ['maintenance', 'Maintenance'], ['closed', 'Closed']] },
        { k: 'notes', label: 'Notes', type: 'textarea', wide: true },
      ],
      columns: [

        { label: 'Name', render: (r) => r.name || dash() },
        { label: 'Level', class: 'tight', render: (r) => el('span', { class: 'code tiny muted' }, r.level || '—') },
        { label: 'Area', render: (r) => tiny(r.area || '—') },
        { label: 'Type', render: (r) => tiny(optLabel('kiosks', 'kind', r.kind)) },
        { label: 'Tills', class: 'num', render: (r) => r.tills || dash() },
        { label: 'Status', class: 'tight', render: (r) => pill(r.status === 'active' ? 'good' : r.status === 'maintenance' ? 'warn' : 'neutral', optLabel('kiosks', 'status', r.status)) },

    },

    storage: {
      title: 'Storage', singular: 'Storage room',
      blurb: 'Rooms and the numbered bays inside them. Stock is let to a vendor at the bay, never at the room.',
      empty: 'Add the cold rooms, dry stores and cages. Recording how many bays a room holds is what lets you allocate named space instead of telling two vendors to share a cold room.',
      fields: [
        { k: 'code', label: 'Code', type: 'text', required: true },
        { k: 'name', label: 'Name', type: 'text', wide: true },
        { k: 'level', label: 'Level', type: 'select', options: LEVELS },
        { k: 'klass', label: 'Class', type: 'select', options: [['dry', 'Dry'], ['chilled', 'Chilled'], ['frozen', 'Frozen'], ['beverage', 'Beverage'], ['gas', 'Gas'], ['merchandise', 'Merchandise'], ['waste', 'Waste']] },
        { k: 'tempMin', label: 'Temp from (°C)', type: 'number' },
        { k: 'tempMax', label: 'Temp to (°C)', type: 'number' },
        { k: 'area', label: 'Floor area (m²)', type: 'number' },
        { k: 'bays', label: 'Number of bays', type: 'number' },
        { k: 'bayUnit', label: 'A bay holds', type: 'select', options: [['pallet', 'Pallets'], ['crate', 'Crates'], ['shelf_m', 'Shelf metres'], ['keg', 'Kegs']] },
        { k: 'bayCapacity', label: 'Capacity per bay', type: 'number' },
        { k: 'baysLet', label: 'Bays let', type: 'number', hint: 'How many are spoken for' },
        { k: 'security', label: 'Security', type: 'select', options: [['locked', 'Locked'], ['caged', 'Caged'], ['alarmed', 'Alarmed'], ['open', 'Open']] },
        { k: 'keyholder', label: 'Keyholder', type: 'text' },
        { k: 'notes', label: 'Notes', type: 'textarea', wide: true },
      ],
      columns: [
        { label: 'Code', render: (r) => el('span', { class: 'code strong' }, r.code) },
        { label: 'Room', render: (r) => r.name || dash() },
        { label: 'Level', class: 'tight', render: (r) => el('span', { class: 'code tiny muted' }, r.level || '—') },
        { label: 'Class', class: 'tight', render: (r) => pill(ROOM_TONE[r.klass] || 'neutral', optLabel('storage', 'klass', r.klass)) },
        { label: 'Temp', render: (r) => el('span', { class: 'code tiny muted' }, tempRange(r)) },
        { label: 'Bays', class: 'num', render: (r) => (r.bays ? (r.baysLet || 0) + ' / ' + r.bays : dash()) },
        { label: 'Fill', render: (r) => bayFill(r) },
        { label: 'Security', class: 'tight', render: (r) => pill(r.security === 'open' ? 'warn' : 'neutral', optLabel('storage', 'security', r.security)) },
      ],
      sort: (a, b) => String(a.code || '').localeCompare(String(b.code || '')),
      search: (r) => [r.code, r.name, r.klass, r.level].join(' '),
    },

    crews: {
      title: 'Crews', singular: 'Crew',
      blurb: 'The loading teams who move stock from the stores to the counters.',
      empty: 'Add the loading crews. The call sign matters more than the name — it is what control actually says on the radio.',
      fields: [
        { k: 'callSign', label: 'Call sign', type: 'text', required: true },
        { k: 'code', label: 'Crew code', type: 'text' },
        { k: 'name', label: 'Name', type: 'text', wide: true },
        { k: 'base', label: 'Base area', type: 'text' },
        { k: 'members', label: 'People', type: 'number' },
        { k: 'trolleys', label: 'Trolleys', type: 'number' },

        { k: 'status', label: 'Status', type: 'select', options: [['off', 'Off shift'], ['available', 'Available'], ['on_run', 'On a run'], ['break', 'On break']] },
        { k: 'notes', label: 'Notes', type: 'textarea', wide: true },
      ],
      columns: [
        { label: 'Call sign', render: (r) => twoLine(r.callSign, r.code) },
        { label: 'Crew', render: (r) => tiny(r.name || '—') },
        { label: 'Base', render: (r) => tiny(r.base || '—') },
        { label: 'People', class: 'num', render: (r) => r.members || dash() },
        { label: 'Trolleys', class: 'num', render: (r) => r.trolleys || dash() },
        { label: 'Status', class: 'tight', render: (r) => pill(r.status === 'available' ? 'good' : r.status === 'on_run' ? 'info' : r.status === 'break' ? 'warn' : 'neutral', optLabel('crews', 'status', r.status)) },
      ],
      sort: (a, b) => String(a.code || a.callSign || '').localeCompare(String(b.code || b.callSign || '')),
      search: (r) => [r.callSign, r.code, r.name, r.base].join(' '),
    },

    stock: {
      title: 'Stock', singular: 'Stock line',
      blurb: 'The catalogue: what is sold, what it costs and what it sells for.',
      empty: 'Add the lines you stock. Pack size matters — a crew carries whole cases, so a replenishment run rounds up to them.',
      fields: [
        { k: 'sku', label: 'SKU', type: 'text', required: true },
        { k: 'name', label: 'Item', type: 'text', required: true, wide: true },
        { k: 'category', label: 'Category', type: 'select', options: [['beer', 'Beer'], ['cider', 'Cider'], ['soft_drink', 'Soft drink'], ['water', 'Water'], ['hot_drink', 'Hot drink'], ['food_hot', 'Hot food'], ['food_cold', 'Cold food'], ['snack', 'Snack'], ['consumable', 'Consumable'], ['merchandise', 'Merchandise']] },
        { k: 'pack', label: 'Units per case', type: 'number' },
        { k: 'cost', label: 'Cost per unit (R)', type: 'number', step: '0.01' },
        { k: 'price', label: 'Board price (R)', type: 'number', step: '0.01' },
        { k: 'chill', label: 'Needs chilling', type: 'select', options: [['no', 'No'], ['yes', 'Yes']] },
        { k: 'notes', label: 'Notes', type: 'textarea', wide: true },
      ],
      columns: [
        { label: 'SKU', render: (r) => el('span', { class: 'code' }, r.sku) },
        { label: 'Item', render: (r) => el('span', { class: 'strong' }, r.name) },
        { label: 'Category', render: (r) => tiny(optLabel('stock', 'category', r.category)) },
        { label: 'Case', class: 'num', render: (r) => r.pack || dash() },
        { label: 'Cost', class: 'num', render: (r) => (r.cost ? rand(r.cost) : dash()) },
        { label: 'Price', class: 'num', render: (r) => (r.price ? rand(r.price) : dash()) },
        { label: 'Margin', class: 'num', render: (r) => marginCell(r) },
        { label: 'Chilled', class: 'tight', render: (r) => (r.chill === 'yes' ? pill('info', 'Chilled') : '') },
      ],
      sort: (a, b) => String(a.name || '').localeCompare(String(b.name || '')),
      search: (r) => [r.sku, r.name, r.category].join(' '),
    },
  };

  const SECTIONS = Object.keys(SCHEMA);

  const EVENT_TONE = { planned: 'neutral', accreditation: 'info', load_in: 'warn', live: 'crit', closed: 'warn', reconciled: 'good' };
  const VENDOR_TONE = { prospect: 'info', approved: 'good', suspended: 'warn', blacklisted: 'crit' };
  const ROOM_TONE = { chilled: 'info', frozen: 'info', dry: 'neutral', beverage: 'good', gas: 'crit', merchandise: 'neutral', waste: 'neutral' };

  /* ==================================================================
   * State
   * ================================================================ */

  const store = {};
  for (const s of SECTIONS) store[s] = [];

  let db = null;
  let sample = null;
  let dbState = 'connecting';
  let venue = 'fnb';
  let view = 'dashboard';
  let editing = null;
  let search = '';
  let assist = { busy: false, text: '', question: '' };
  let toastTimer = null;
  const subs = [];

  /* ==================================================================
   * Helpers
   * ================================================================ */

  function el(tag, attrs, ...kids) {
    const node = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat(5)) {
      if (kid == null || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }

  function svgEl(tag, attrs, ...kids) {
    const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      node.setAttribute(k, String(v));
    }
    for (const kid of kids.flat(3)) {
      if (kid == null || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  }

  const tiny = (t) => el('span', { class: 'tiny muted' }, t);
  const dash = () => el('span', { class: 'muted' }, '—');

  /** Status is never colour alone: every pill carries its word. */
  const pill = (tone, text) => el('span', { class: 'pill p-' + tone }, text || '—');

  const twoLine = (main, sub) => el('span', null,
    el('div', { class: 'strong' }, main || '—'),
    sub ? el('div', { class: 'tiny muted code' }, sub) : null);

  const numFmt = (n) => new Intl.NumberFormat('en-ZA').format(Number(n) || 0);
  const rand = (n) => 'R' + new Intl.NumberFormat('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n) || 0);

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T12:00:00');
    if (Number.isNaN(d.getTime())) return iso;
    return new Intl.DateTimeFormat('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
  }

  function optLabel(sec, key, value) {
    const f = SCHEMA[sec].fields.find((x) => x.k === key);
    if (!f || !f.options) return value || '—';
    const hit = f.options.find(([v]) => v === value);
    return hit ? hit[1] : (value || '—');
  }

  function tempRange(r) {
    if (r.tempMin == null && r.tempMax == null) return 'Ambient';
    if (r.tempMin == null) return '≤ ' + r.tempMax + '°C';
    if (r.tempMax == null) return '≥ ' + r.tempMin + '°C';
    return r.tempMin + '° to ' + r.tempMax + '°C';
  }

  function marginCell(r) {
    if (!r.price || !r.cost) return dash();
    const m = (Number(r.price) - Number(r.cost)) / Number(r.price);
    return el('span', { style: m < 0.3 ? 'color:var(--warn);font-weight:600' : null }, Math.round(m * 100) + '%');
  }

  function bayFill(r) {
    if (!r.bays) return dash();
    const f = Math.min(1, (r.baysLet || 0) / r.bays);
    return el('div', { class: 'chartRow', style: 'padding:0;gap:7px' },
      el('div', { class: 'chartTrack', style: 'height:8px;min-width:54px' },
        el('div', { class: 'chartBar', style: 'width:' + f * 100 + '%;background:' + (f >= 1 ? 'var(--crit)' : f >= 0.85 ? 'var(--warn)' : 'var(--viz-1)') })),
      el('span', { class: 'tiny muted', style: 'min-width:30px' }, Math.round(f * 100) + '%'));
  }

  function docPill(r) {
    const held = new Set(r.docs || []);
    const missing = BASE_DOCS.filter((d) => !held.has(d));
    if (r.status !== 'approved') return pill('neutral', held.size + ' on file');
    if (missing.length) return pill('crit', missing.length + ' outstanding');
    return pill('good', 'Complete');
  }

  function toast(message) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    if (toastTimer) clearTimeout(toastTimer);
    const node = el('div', { class: 'toast', role: 'status' }, message);
    document.body.append(node);
    toastTimer = setTimeout(() => node.remove(), 4200);
  }

  const forVenue = (sec) => store[sec].filter((r) => r.venue === venue);

  /* ==================================================================
   * Charts — hand-drawn, no library. Every bar carries a direct label,
   * which is also the relief the palette validator requires for the
   * lighter series steps.
   * ================================================================ */

  /**
   * Horizontal bars, one scale across the set, every bar directly labelled.
   *
   * A row may carry `fill` (0–1) to encode a SECOND quantity inside the first
   * — used for "bays let of bays available", where the bar's length is the
   * room's size and the solid part is how much of it is spoken for. Without
   * that, a bar drawn at the room's size beside the words "bays let" claims
   * a full room when nothing is let at all.
   */
  function barChart(rows, opts = {}) {
    const max = Math.max(1, ...rows.map((r) => r.value));
    const colour = opts.colour || 'var(--viz-1)';

    return el('div', null, rows.map((r) => {
      const width = (r.value / max) * 100;
      const hasFill = r.fill != null;
      const bar = el('div', {
        class: 'chartBar',
        style: 'width:' + width + '%;'
          + (hasFill
            ? 'background:var(--viz-track);border:1px solid ' + (r.colour || colour) + ';'
            : 'background:' + (r.colour || colour) + ';'),
        title: r.label + ': ' + (r.display ?? r.value),
      });

      if (hasFill) {
        bar.append(el('div', {
          style: 'height:100%;width:' + Math.min(100, Math.max(0, r.fill * 100)) + '%;'
            + 'background:' + (r.colour || colour) + ';',
        }));
      }

      return el('div', { class: 'chartRow' },
        el('span', { class: 'chartLabel' }, r.label,
          r.sub ? el('div', { class: 'tiny muted' }, r.sub) : null),
        el('div', { class: 'chartTrack' }, bar),
        el('span', { class: 'chartVal' }, r.display ?? numFmt(r.value)));
    }));
  }

  /** Readiness ring — one figure, drawn as a arc so it reads at a glance. */
  function ring(fraction, label, sublabel) {
    const size = 116, stroke = 11, r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(1, fraction));
    const tone = pct >= 0.85 ? 'var(--good)' : pct >= 0.5 ? 'var(--warn)' : 'var(--crit)';

    return el('div', { style: 'display:flex;align-items:center;gap:15px;flex-wrap:wrap' },
      svgEl('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size, role: 'img', 'aria-label': label + ': ' + Math.round(pct * 100) + '%' },
        svgEl('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--viz-track)', 'stroke-width': stroke }),
        svgEl('circle', {
          cx: size / 2, cy: size / 2, r, fill: 'none', stroke: tone, 'stroke-width': stroke,
          'stroke-linecap': 'round', 'stroke-dasharray': c,
          'stroke-dashoffset': c * (1 - pct),
          transform: 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')',
        }),
        svgEl('text', {
          x: size / 2, y: size / 2 + 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
          fill: 'var(--text)', 'font-size': '25', 'font-weight': '800', 'font-family': 'Archivo, sans-serif',
        }, Math.round(pct * 100) + '%')),
      el('div', null,
        el('div', { class: 'strong', style: 'font-size:14px' }, label),
        el('div', { class: 'tiny muted', style: 'margin-top:3px;max-width:30ch' }, sublabel)));
  }

  /* ==================================================================
   * Persistence
   * ================================================================ */

  /*
   * Records have two possible homes, chosen at boot.
   *
   * Inside an Artifact the page is handed a real shared store, and every
   * viewer sees the same records. Served as a static file — GitHub Pages,
   * or a local copy — there is no server at all, so records go to this
   * browser's localStorage: they survive a reload on this machine and go
   * no further. The screen always says which of the two is in force,
   * because mistaking the second for the first loses work.
   */
  const LOCAL_KEY = 'fnb-stadium-admin/v1';

  function localWritable() {
    try {
      window.localStorage.setItem(LOCAL_KEY + '/probe', '1');
      window.localStorage.removeItem(LOCAL_KEY + '/probe');
      return true;
    } catch { return false; }
  }

  function hydrateLocal() {
    let raw = null;
    try { raw = window.localStorage.getItem(LOCAL_KEY); } catch { return; }
    if (!raw) return;
    try {
      const saved = JSON.parse(raw);
      for (const s of SECTIONS) if (Array.isArray(saved[s])) store[s] = saved[s];
    } catch { /* corrupt or half-written — start empty rather than crash */ }
  }

  function persistLocal() {
    try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(store)); return true; }
    catch { return false; }
  }

  async function connect() {
    try { db = await claude.use('db'); } catch { db = null; }
    try { sample = await claude.use('sample'); } catch { sample = null; }

    if (!db) {
      hydrateLocal();
      dbState = localWritable() ? 'local' : 'offline';
      render();
      return;
    }

    dbState = 'ready';
    for (const name of SECTIONS) {
      subs.push(db.collection(name).onSnapshot(
        (snap) => {
          store[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        },
        (err) => { dbState = 'offline'; toast('Lost the connection to saved records (' + err.code + ')'); render(); },
      ));
    }
    render();
  }

  async function saveRecord(sec, id, values) {
    const body = { ...values, venue, updatedAt: new Date().toISOString() };
    if (!db) {
      if (id) {
        const i = store[sec].findIndex((r) => r.id === id);
        if (i >= 0) store[sec][i] = { id, ...body };
      } else store[sec].push({ id: 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), ...body });
      const kept = persistLocal();
      render();
      return { ok: true, offline: !kept };
    }
    try {
      if (id) await db.collection(sec).doc(id).set(body);
      else await db.collection(sec).add({ ...body, createdAt: body.updatedAt });
      return { ok: true };
    } catch (e) { return { ok: false, error: describe(e) }; }
  }

  async function deleteRecord(sec, id) {
    if (!db) {
      store[sec] = store[sec].filter((r) => r.id !== id);
      persistLocal();
      render();
      return { ok: true };
    }
    try { await db.collection(sec).doc(id).delete(); return { ok: true }; }
    catch (e) { return { ok: false, error: describe(e) }; }
  }

  function describe(e) {
    const code = e && e.code ? e.code : 'unavailable';
    if (code === 'quota_exceeded') return 'This workspace is full — delete some records first.';
    if (code === 'not_granted') return 'Saving is not available in this view.';
    if (code === 'invalid_argument') return 'That record could not be saved as written.';
    if (code === 'resource_exhausted') return 'Too many changes at once — try again shortly.';
    return 'Could not save (' + code + ').';
  }

  /* ==================================================================
   * Starter layout.
   *
   * There is no public register of any stadium's storage rooms — that is
   * an internal document, so nothing on the internet can be read for it.
   * What IS public is each venue's capacity and tier structure, and this
   * builds a first-cut operational skeleton from those: counters scaled
   * to the crowd, a bulk store core, satellites per concourse level, and
   * crews to match. It is a starting point to correct against SMSA's own
   * asset register, not a claim about the building.
   * ================================================================ */

  function starterPlan(v) {
    const seatsPerCounter = 1000;
    const counters = Math.max(6, Math.round(v.capacity / seatsPerCounter));
    const levels = v.kind === 'Indoor arena' ? ['L0'] : v.tiers >= 3 ? ['L1', 'L2', 'L3'] : v.tiers === 2 ? ['L1', 'L3'] : ['L1'];
    const sectors = v.capacity > 40000 ? ['N', 'E', 'S', 'W'] : ['N', 'S'];

    const kiosks = [];
    const kinds = ['beverage', 'combo', 'food', 'beverage', 'combo', 'coffee', 'merchandise'];
    let n = 0;
    outer: for (const lvl of levels) {
      for (const sector of sectors) {
        const per = Math.ceil(counters / (levels.length * sectors.length));
        for (let i = 0; i < per; i++) {
          if (n >= counters) break outer;
          n++;
          const kind = lvl === 'L2' ? 'premium' : kinds[n % kinds.length];
          kiosks.push({
            code: 'K-' + lvl + '-' + String(n).padStart(3, '0'),
            name: lvl + ' ' + sector + ' counter ' + n,
            level: lvl, area: sector, kind,
            tills: kind === 'premium' || kind === 'merchandise' ? 2 : 4,
            gas: kind === 'food' || kind === 'combo' ? 'yes' : 'no',
            status: 'active',
          });
        }
      }
    }

    const big = v.capacity > 40000;
    const rooms = [
      { code: 'MR1', name: 'Main Receiving', level: 'L0', klass: 'dry', area: big ? 420 : 180, bays: big ? 36 : 16, bayUnit: 'pallet', bayCapacity: 4, security: 'alarmed' },
      { code: 'CR1', name: 'Cold Room 1', level: 'L0', klass: 'chilled', tempMin: 1, tempMax: 5, area: big ? 96 : 48, bays: big ? 18 : 8, bayUnit: 'pallet', bayCapacity: 3, security: 'locked' },
      { code: 'FZ1', name: 'Freezer Store', level: 'L0', klass: 'frozen', tempMin: -22, tempMax: -18, area: big ? 64 : 32, bays: big ? 16 : 8, bayUnit: 'pallet', bayCapacity: 2, security: 'locked' },
      { code: 'BV1', name: 'Beverage Store', level: 'L0', klass: 'beverage', area: big ? 180 : 80, bays: big ? 24 : 10, bayUnit: 'pallet', bayCapacity: 4, security: 'caged' },
      { code: 'GS1', name: 'Gas Cage', level: 'L0', klass: 'gas', area: 24, bays: 4, bayUnit: 'crate', bayCapacity: 12, security: 'caged' },
      { code: 'MD1', name: 'Merchandise Store', level: 'L0', klass: 'merchandise', area: big ? 110 : 50, bays: big ? 20 : 8, bayUnit: 'shelf_m', bayCapacity: 8, security: 'alarmed' },
      { code: 'WS1', name: 'Waste Marshalling', level: 'L0', klass: 'waste', area: big ? 140 : 60, bays: 8, bayUnit: 'crate', bayCapacity: 30, security: 'open' },
    ];
    if (big) rooms.push({ code: 'CR2', name: 'Cold Room 2', level: 'L0', klass: 'chilled', tempMin: 1, tempMax: 5, area: 96, bays: 18, bayUnit: 'pallet', bayCapacity: 3, security: 'locked' });

    for (const lvl of levels.filter((l) => l !== 'L0')) {
      for (const sector of sectors) {
        rooms.push({
          code: lvl + 'S-' + sector, name: lvl + ' ' + sector + ' satellite', level: lvl,
          klass: sector === 'N' || sector === 'S' ? 'chilled' : 'dry',
          tempMin: sector === 'N' || sector === 'S' ? 2 : null,
          tempMax: sector === 'N' || sector === 'S' ? 6 : null,
          area: 38, bays: 8, bayUnit: 'pallet', bayCapacity: 2, security: 'locked',
        });
      }
    }

    const crewCount = Math.max(2, Math.round(kiosks.length / 9));
    const CALLS = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India', 'Juliet', 'Kilo', 'Lima'];
    const crews = [];
    for (let i = 0; i < crewCount; i++) {
      crews.push({
        code: 'C' + (i + 1), callSign: CALLS[i % CALLS.length],
        name: 'Crew ' + (i + 1), base: levels[i % levels.length] + ' ' + sectors[i % sectors.length],
        members: 4, trolleys: 2, shift: 'double', status: 'off',
      });
    }

    return { kiosks, storage: rooms, crews };
  }

  async function loadStarter() {
    const v = venueById.get(venue);
    const plan = starterPlan(v);
    const total = plan.kiosks.length + plan.storage.length + plan.crews.length;

    const existing = forVenue('kiosks').length + forVenue('storage').length + forVenue('crews').length;
    const warn = existing > 0
      ? '\n\nThis venue already has ' + existing + ' of these records. The starter layout ADDS to them — it does not replace anything.'
      : '';

    const ok = window.confirm(
      'Build a starter layout for ' + v.name + '?\n\n' +
      plan.kiosks.length + ' kiosks\n' + plan.storage.length + ' storage rooms\n' + plan.crews.length + ' crews\n\n' +
      'Sized from the venue’s published capacity of ' + numFmt(v.capacity) + '. These are a first cut to correct against SMSA’s asset register, not a record of the real building.' + warn,
    );
    if (!ok) return;

    toast('Building ' + total + ' records…');
    let made = 0;
    for (const [sec, rows] of [['kiosks', plan.kiosks], ['storage', plan.storage], ['crews', plan.crews]]) {
      for (const row of rows) {
        const res = await saveRecord(sec, null, row);
        if (!res.ok) { toast(res.error); return; }
        made++;
      }
    }
    toast(made + ' records created for ' + v.name);
    render();
  }

  /* ==================================================================
   * Assist — the page asking Claude a question of its own.
   * ================================================================ */

  const ASSIST_PROMPTS = [
    ['Stock plan', 'Draft a first-cut stock plan for the next event at this venue: which categories to stock, rough quantities per 1000 attendees, and what to watch.'],
    ['Compliance brief', 'Summarise which documents each vendor here still needs before they can be allocated a counter, and the risk of trading without each one.'],
    ['Staffing estimate', 'Estimate the front-of-counter staffing and loading crew needed for the next event at this venue, and explain the assumptions.'],
    ['Readiness review', 'Review this venue’s setup and name the three things most likely to cause a problem on event day.'],
  ];

  function venueBrief() {
    const v = venueById.get(venue);
    const lines = [
      'Venue: ' + v.name + ' (' + v.kind + '), ' + v.suburb + ', published capacity ' + v.capacity + '.',
      'Kiosks on record: ' + forVenue('kiosks').length + '.',
      'Storage rooms: ' + forVenue('storage').length + ' holding ' + forVenue('storage').reduce((s, r) => s + (Number(r.bays) || 0), 0) + ' bays.',
      'Loading crews: ' + forVenue('crews').length + '.',
      'Stock lines: ' + forVenue('stock').length + '.',
      'Vendors: ' + forVenue('vendors').length + ' (' + forVenue('vendors').filter((x) => x.status === 'approved').length + ' approved).',
    ];
    const next = nextEvent();
    lines.push(next
      ? 'Next event: ' + next.name + ' on ' + next.date + ', expected attendance ' + (next.attendance || 'unknown') + ', stage ' + next.status + '.'
      : 'No events are booked yet.');
    return lines.join('\n');
  }

  async function runAssist(question) {
    if (!sample) return;
    assist = { busy: true, text: '', question };
    render();

    try {
      const answer = await sample(
        'You are assisting an operations administrator at Stadium Management South Africa (SMSA), ' +
        'who runs concessions and logistics at this venue. Answer in plain South African English, ' +
        'using rand and metric units. Be concrete and brief — short headed sections or bullets, no preamble. ' +
        'Where the data below is thin, say what is missing rather than inventing it.\n\n' +
        'CURRENT STATE\n' + venueBrief() + '\n\nTASK\n' + question,
        {
          modelTier: 'default',
          onText: ({ text }) => { assist.text = text; render(); },
        },
      );
      assist = { busy: false, text: answer.text, question };
    } catch (e) {
      const code = e && e.code ? e.code : 'unavailable';
      assist = {
        busy: false,
        question,
        text: code === 'rate_limited'
          ? 'Too many requests just now — give it a minute.'
          : code === 'not_granted'
            ? 'Assist is not available in this view.'
            : 'Could not get an answer (' + code + ').' + (e && e.text ? '\n\n' + e.text : ''),
      };
    }
    render();
  }

  /* ==================================================================
   * Views
   * ================================================================ */

  function nextEvent() {
    return forVenue('events')
      .filter((e) => e.date)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .find((e) => e.status !== 'closed' && e.status !== 'reconciled');
  }

  function head(eyebrow, title, sub, actions) {
    return el('header', { class: 'head' },
      el('div', null,
        eyebrow ? el('div', { class: 'eyebrow' }, eyebrow) : null,
        el('h1', null, title),
        sub ? el('div', { class: 'sub' }, sub) : null),
      actions ? el('div', { class: 'headActions' }, actions) : null);
  }

  /* ---------- dashboard ---------- */

  function dashboard() {
    const v = venueById.get(venue);
    const kiosks = forVenue('kiosks');
    const rooms = forVenue('storage');
    const vendors = forVenue('vendors');
    const crews = forVenue('crews');
    const stock = forVenue('stock');
    const events = forVenue('events');

    const tills = kiosks.filter((k) => k.status === 'active').reduce((s, k) => s + (Number(k.tills) || 0), 0);
    const bays = rooms.reduce((s, r) => s + (Number(r.bays) || 0), 0);
    const baysLet = rooms.reduce((s, r) => s + (Number(r.baysLet) || 0), 0);
    const approved = vendors.filter((x) => x.status === 'approved');
    const blocked = approved.filter((x) => {
      const held = new Set(x.docs || []);
      return BASE_DOCS.some((d) => !held.has(d));
    });

    /* Readiness: the six things that have to exist before an event can run. */
    const checks = [
      ['Counters recorded', kiosks.length > 0],
      ['Storage recorded', rooms.length > 0],
      ['Vendors registered', vendors.length > 0],
      ['Every approved vendor compliant', approved.length > 0 && blocked.length === 0],
      ['Loading crews listed', crews.length > 0],
      ['Stock catalogue started', stock.length > 0],
    ];
    const ready = checks.filter(([, done]) => done).length / checks.length;

    const seatsPerTill = tills > 0 ? Math.round(v.capacity / tills) : null;
    const next = nextEvent();

    const out = [
      head('Venue dashboard', v.name,
        [v.aka, v.suburb, numFmt(v.capacity) + ' capacity'].filter(Boolean).join(' · '),
        [
          el('button', { class: 'btn ghost', onclick: () => go('venues') }, 'Venue profile'),
          kiosks.length === 0
            ? el('button', { class: 'btn primary', onclick: loadStarter }, 'Build starter layout')
            : el('button', { class: 'btn primary', onclick: () => go('events') }, 'Add a booking'),
        ]),
    ];

    if (dbState === 'offline') {
      out.push(el('div', { class: 'notice warn', style: 'margin-bottom:13px' },
        el('strong', null, 'Not saving. '),
        'This browser is blocking site storage, so anything entered here is lost on reload. Allow site data for this page, or run the server edition.'));
    } else if (dbState === 'local') {
      out.push(el('div', { class: 'notice info', style: 'margin-bottom:13px' },
        el('strong', null, 'Saved in this browser. '),
        'Records entered here stay on this device — they survive a reload, but nobody else sees them. For a shared database, several operators at once and an audit trail, run the server edition in this repository.'));
    }

    out.push(el('div', { class: 'tiles' },
      tile('Capacity', numFmt(v.capacity), v.kind, null),
      tile('Counters', kiosks.length, kiosks.length ? tills + ' tills across active counters' : 'None recorded', kiosks.length ? null : 'warn', () => go('kiosks')),
      tile('Storage bays', bays || '—', rooms.length ? rooms.length + ' rooms · ' + Math.round(bays ? (baysLet / bays) * 100 : 0) + '% let' : 'None recorded', null, () => go('storage')),
      tile('Vendors', vendors.length, approved.length + ' approved', blocked.length ? 'crit' : null, () => go('vendors')),
      tile('Seats per till', seatsPerTill ? numFmt(seatsPerTill) : '—',
        seatsPerTill ? (seatsPerTill > 550 ? 'Under-served — expect queues' : seatsPerTill > 350 ? 'Tight' : 'Comfortable') : 'Add counters to measure',
        seatsPerTill ? (seatsPerTill > 550 ? 'crit' : seatsPerTill > 350 ? 'warn' : 'good') : null)));

    if (blocked.length) {
      out.push(el('div', { class: 'notice crit', style: 'margin-top:13px' },
        el('strong', null, blocked.length + ' approved vendor' + (blocked.length === 1 ? '' : 's') + ' cannot be allocated a counter. '),
        blocked.map((x) => x.name).join(', ') + ' — core documents outstanding.'));
    }

    out.push(el('div', { class: 'grid gMain', style: 'margin-top:14px' },
      el('div', { class: 'grid' },
        panel('Event readiness', checks.filter(([, d]) => d).length + ' of ' + checks.length, null,
          el('div', null,
            ring(ready, ready === 1 ? 'Ready to trade' : 'Setup incomplete',
              ready === 1
                ? 'Everything an event needs is on record for this venue.'
                : 'Finish the outstanding items below before booking an event against this venue.'),
            el('div', { style: 'margin-top:15px;display:grid;gap:7px' },
              checks.map(([label, done]) =>
                el('div', { style: 'display:flex;align-items:center;gap:9px;font-size:12.5px' },
                  done ? tickIcon('var(--good)') : dotIcon('var(--muted-2)'),
                  el('span', { style: done ? null : 'color:var(--muted)' }, label),
                  done ? null : el('span', { class: 'pill p-warn', style: 'margin-left:auto' }, 'Outstanding')))))),

        rooms.length
          ? panel('Storage by room', 'Bar length is the room; solid is let', null,
              el('div', null,
                barChart(rooms.slice(0, 10).map((r) => {
                  const bays = Number(r.bays) || 0;
                  const let_ = Number(r.baysLet) || 0;
                  const full = bays > 0 && let_ >= bays;
                  return {
                    label: r.code,
                    sub: r.name,
                    value: bays,
                    fill: bays > 0 ? let_ / bays : 0,
                    display: let_ + ' / ' + bays,
                    colour: full ? 'var(--crit)' : 'var(--viz-1)',
                  };
                })),
                el('div', { class: 'legend' },
                  el('span', null, el('span', { class: 'swatch', style: 'background:var(--viz-1)' }), 'Bays let'),
                  el('span', null, el('span', { class: 'swatch', style: 'background:var(--viz-track);border:1px solid var(--viz-1)' }), 'Still free'),
                  el('span', null, el('span', { class: 'swatch', style: 'background:var(--crit)' }), 'Fully let'))))
          : null,

        kiosks.length
          ? panel('Counters by type', kiosks.length + ' recorded', null, kioskMix(kiosks))
          : null),

      el('div', { class: 'grid' },
        next
          ? panel('Next booking', null, el('button', { class: 'btn sm', onclick: () => go('events') }, 'Open'),
              el('div', null,
                el('div', { class: 'strong', style: 'font-size:15px' }, next.name),
                el('div', { class: 'tiny muted', style: 'margin-top:3px' },
                  [fmtDate(next.date), next.doors ? 'gates ' + next.doors : null, next.start ? 'start ' + next.start : null].filter(Boolean).join(' · ')),
                el('div', { style: 'margin-top:10px;display:flex;gap:6px;flex-wrap:wrap' },
                  pill(EVENT_TONE[next.status] || 'neutral', optLabel('events', 'status', next.status)),
                  next.attendance ? pill('neutral', numFmt(next.attendance) + ' expected') : null,
                  next.attendance && v.capacity ? pill('info', Math.round((next.attendance / v.capacity) * 100) + '% of capacity') : null)))
          : panel('Next booking', null, null,
              el('div', { class: 'muted', style: 'font-size:12.5px' },
                'Nothing booked at ' + v.name + ' yet. ',
                el('button', { class: 'btn sm', style: 'margin-top:9px', onclick: () => go('events') }, 'Add a booking'))),

        assistPanel(),

        panel('The building', v.suburb, el('button', { class: 'btn sm', onclick: () => go('venues') }, 'Venue profile'),
          el('dl', { class: 'dl' }, [
            ['Capacity', numFmt(v.capacity)],
            ['Seating tiers', String(v.tiers)],
            ['Suites', numFmt(v.suites)],
            ['Parking', numFmt(v.parking) + ' bays'],
            ['Opened', String(v.opened)],
          ].map(([k, val]) => [el('dt', null, k), el('dd', null, val)]))))));

    return out;
  }

  function kioskMix(kiosks) {
    const by = new Map();
    for (const k of kiosks) by.set(k.kind || 'other', (by.get(k.kind || 'other') || 0) + 1);
    const rows = [...by.entries()].sort((a, b) => b[1] - a[1]);
    // Three validated hues, then everything else folds into one neutral.
    const HUES = ['var(--viz-1)', 'var(--viz-2)', 'var(--viz-3)'];
    return el('div', null,
      barChart(rows.map(([kind, n], i) => ({
        label: optLabel('kiosks', 'kind', kind),
        value: n,
        display: String(n),
        colour: i < 3 ? HUES[i] : 'var(--muted-2)',
      }))),
      rows.length > 3 ? el('div', { class: 'legend' }, el('span', null, 'Types past the third share one neutral.')) : null);
  }

  function tile(label, value, note, tone, onclick) {
    const kids = [
      el('div', { class: 'tileLabel' }, label),
      el('div', { class: 'tileVal' + (tone ? ' ' + tone : '') }, value),
      note ? el('div', { class: 'tileNote' }, note) : null,
    ];
    return onclick
      ? el('button', { class: 'tile', onclick }, kids)
      : el('div', { class: 'tile' }, kids);
  }

  function panel(title, hint, action, body) {
    return el('section', { class: 'panel' },
      title ? el('div', { class: 'panelHead' },
        el('div', { style: 'display:flex;align-items:baseline;gap:9px;min-width:0' },
          el('span', { class: 'panelTitle' }, title),
          hint ? el('span', { class: 'panelHint' }, hint) : null),
        action || null) : null,
      el('div', { class: 'panelBody' }, body));
  }

  function tickIcon(colour) {
    return svgEl('svg', { width: 13, height: 13, viewBox: '0 0 16 16', 'aria-hidden': 'true' },
      svgEl('path', { d: 'M3 8.5l3.2 3.2L13 5', fill: 'none', stroke: colour, 'stroke-width': '2.2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  }

  function dotIcon(colour) {
    return svgEl('svg', { width: 13, height: 13, viewBox: '0 0 16 16', 'aria-hidden': 'true' },
      svgEl('circle', { cx: 8, cy: 8, r: 3.4, fill: 'none', stroke: colour, 'stroke-width': '1.6' }));
  }

  /* ---------- assist panel ---------- */

  function assistPanel() {
    if (!sample) return null;

    return panel('Assist', assist.busy ? 'thinking…' : null, null,
      el('div', null,
        el('div', { class: 'assistChips' },
          ASSIST_PROMPTS.map(([label, prompt]) =>
            el('button', {
              class: 'btn sm' + (assist.question === prompt ? ' primary' : ''),
              disabled: assist.busy,
              onclick: () => runAssist(prompt),
            }, label))),
        assist.text
          ? el('div', { class: 'assistOut' }, assist.text)
          : el('div', { class: 'tiny muted' },
              'Ask for a stock plan, a compliance brief or a staffing estimate against what this venue currently has on record. Answers come from Claude and are a starting point, not an instruction — check them before acting.'),
        assist.text && !assist.busy
          ? el('button', { class: 'btn sm', style: 'margin-top:9px', onclick: () => { assist = { busy: false, text: '', question: '' }; render(); } }, 'Clear')
          : null));
  }

  /* ---------- venues ---------- */

  function venuesView() {
    const v = venueById.get(venue);

    return [
      head('Venue', v.name,
        'Stadium Management South Africa was appointed by the City of Johannesburg in 2009 and runs FNB Stadium on full financial risk — no management fee, subsidy or grant. The figures below come from published sources, listed at the foot of this page; correct them against the asset register where they differ.',
        el('button', { class: 'btn ghost', onclick: () => go('dashboard') }, 'Back to dashboard')),

      el('div', { class: 'tiles' },
        tile('Capacity', numFmt(v.capacity), 'Largest stadium in Africa'),
        tile('Seating tiers', String(v.tiers), 'Plus two suite levels'),
        tile('Suites', numFmt(v.suites), 'Corporate boxes'),
        tile('Parking', numFmt(v.parking), numFmt(v.vipParking) + ' of them VIP underground')),

      el('div', { class: 'sectionTitle' }, 'Venue profile'),
      el('div', { class: 'panel' }, el('div', { class: 'panelBody' }, venueProfile(v))),

      el('div', { class: 'sectionTitle' }, 'Where these figures come from'),
      el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
        el('div', { class: 'srcList' },
          el('p', { style: 'margin:0 0 8px' },
            'Capacity, tier count and suite numbers were taken from these public sources. ',
            el('strong', null, 'Storage rooms, kiosks and bay counts are not published anywhere'),
            ' — no venue puts its internal asset register online — so the starter layout builds a first cut from capacity and tier structure instead, for you to correct.'),
          el('ul', { style: 'margin:0;padding-left:17px' },
            SOURCES.map(([label, url]) =>
              el('li', null, el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, label))))))),
    ];
  }

  function venueProfile(v) {
    const rows = [
      ['Venue', v.name],
      v.aka ? ['Also known as', v.aka] : null,
      ['Type', v.kind],
      ['Location', v.suburb],
      ['Capacity', numFmt(v.capacity) + (v.capacityNote ? '' : '')],
      v.capacityNote ? ['Note', v.capacityNote] : null,
      v.opened ? ['Opened', String(v.opened)] : null,
      v.tiers ? ['Seating tiers', String(v.tiers)] : null,
      v.suites ? ['Suites', numFmt(v.suites)] : null,
      v.parking ? ['Parking', numFmt(v.parking) + ' bays' + (v.vipParking ? ', plus ' + numFmt(v.vipParking) + ' VIP underground' : '')] : null,
      v.areaSqm ? ['Floor area', numFmt(v.areaSqm) + ' m²'] : null,
    ].filter(Boolean);

    return el('div', null,
      el('dl', { class: 'dl' }, rows.map(([k, val]) => [el('dt', null, k), el('dd', null, val)])),
      v.notes ? el('div', { class: 'notice info', style: 'margin-top:13px' }, v.notes) : null);
  }

  /* ---------- records ---------- */

  function recordsView(sec) {
    const def = SCHEMA[sec];
    const all = forVenue(sec).sort(def.sort);
    const term = search.trim().toLowerCase();
    const rows = term ? all.filter((r) => def.search(r).toLowerCase().includes(term)) : all;
    const v = venueById.get(venue);

    const out = [
      head('Records · ' + v.name, def.title, def.blurb,
        [
          (sec === 'kiosks' || sec === 'storage' || sec === 'crews') && all.length === 0
            ? el('button', { class: 'btn ghost', onclick: loadStarter }, 'Build starter layout')
            : null,
          el('button', { class: 'btn primary', onclick: () => openForm(sec, null) }, 'New ' + def.singular.toLowerCase()),
        ]),
    ];

    if (editing && editing.section === sec) out.push(renderForm());

    if (all.length === 0 && !editing) {
      out.push(el('div', { class: 'empty' },
        el('div', { class: 'emptyTitle' }, 'No ' + def.title.toLowerCase() + ' at ' + v.name),
        el('div', { class: 'emptyBody' }, def.empty),
        el('div', { style: 'display:flex;gap:7px;justify-content:center;flex-wrap:wrap' },
          el('button', { class: 'btn primary', onclick: () => openForm(sec, null) }, 'Add the first ' + def.singular.toLowerCase()),
          (sec === 'kiosks' || sec === 'storage' || sec === 'crews')
            ? el('button', { class: 'btn', onclick: loadStarter }, 'Build a starter layout instead')
            : null)));
      return out;
    }

    if (all.length > 0) {
      out.push(el('div', { class: 'toolbar' },
        el('input', {
          class: 'search', type: 'search', id: 'search-' + sec,
          placeholder: 'Search ' + def.title.toLowerCase() + '…', value: search,
          oninput: (e) => { search = e.target.value; paint(); },
        }),
        el('span', { class: 'count' }, rows.length === all.length ? all.length + ' records' : rows.length + ' of ' + all.length)));

      const header = el('tr', null,
        def.columns.map((c) => el('th', { class: c.class === 'num' ? 'num' : null }, c.label)),
        el('th', null, ''));

      const body = rows.length === 0
        ? el('tr', null, el('td', { colspan: def.columns.length + 1 },
            el('div', { class: 'muted', style: 'padding:20px;text-align:center' }, 'Nothing matches “' + search + '”.')))
        : rows.map((r) => el('tr', null,
            def.columns.map((c) => el('td', { class: c.class || null }, c.render(r))),
            el('td', { class: 'tight' },
              el('div', { class: 'rowBtns' },
                el('button', { class: 'btn sm', onclick: () => openForm(sec, r) }, 'Edit')))));

      out.push(el('div', { class: 'panel' },
        el('div', { class: 'tw' },
          el('table', null,
            el('thead', null, header),
            el('tbody', null, body)))));
    }

    return out;
  }

  /* ---------- form ---------- */

  function openForm(sec, record) {
    editing = { section: sec, id: record ? record.id : null, values: record ? { ...record } : formDefaults(sec), errors: {} };
    render();
    const first = document.querySelector('.formBody input, .formBody select');
    if (first) first.focus();
  }

  function formDefaults(sec) {
    const out = {};
    for (const f of SCHEMA[sec].fields) {
      if (f.type === 'select' && f.options.length) out[f.k] = f.options[0][0];
      if (f.type === 'checks') out[f.k] = [];
    }
    return out;
  }

  function renderForm() {
    const def = SCHEMA[editing.section];
    const values = editing.values;

    const fields = def.fields.map((f) => {
      const id = 'f-' + editing.section + '-' + f.k;
      const err = editing.errors[f.k];
      let input;

      if (f.type === 'select') {
        input = el('select', { id, name: f.k },
          f.options.map(([val, label]) => el('option', { value: val, selected: String(values[f.k] ?? '') === val }, label)));
      } else if (f.type === 'textarea') {
        input = el('textarea', { id, name: f.k, rows: 2 }, values[f.k] || '');
      } else if (f.type === 'checks') {
        const held = new Set(values[f.k] || []);
        input = el('div', { class: 'checks' }, f.options.map(([val, label]) =>
          el('label', { class: 'check' },
            el('input', { type: 'checkbox', name: f.k, value: val, checked: held.has(val) }), label)));
      } else {
        input = el('input', { id, name: f.k, type: f.type, step: f.step, placeholder: f.placeholder, value: values[f.k] ?? '' });
      }

      return el('div', { class: 'field' + (f.wide ? ' wide' : '') + (err ? ' err' : '') },
        el('label', { for: f.type === 'checks' ? null : id }, f.label + (f.required ? ' *' : '')),
        input,
        err ? el('div', { class: 'errMsg' }, err) : f.hint ? el('div', { class: 'hint' }, f.hint) : null);
    });

    const deleteBtn = editing.id
      ? el('button', {
          type: 'button', class: 'btn danger', style: 'margin-left:auto',
          onclick: async () => {
            if (!window.confirm('Delete this ' + def.singular.toLowerCase() + '? This cannot be undone.')) return;
            const res = await deleteRecord(editing.section, editing.id);
            if (res.ok) { toast(def.singular + ' deleted'); editing = null; render(); }
            else toast(res.error);
          },
        }, 'Delete')
      : null;

    return el('form', { class: 'panel formWrap', onsubmit: onSubmit },
      el('div', { class: 'formHead' },
        el('span', { class: 'panelTitle' }, (editing.id ? 'Edit ' : 'New ') + def.singular.toLowerCase() + ' · ' + venueById.get(venue).name),
        el('button', { type: 'button', class: 'btn sm', onclick: () => { editing = null; render(); } }, 'Close')),
      el('div', { class: 'formBody' }, fields),
      el('div', { class: 'formFoot' },
        el('button', { type: 'submit', class: 'btn primary' }, editing.id ? 'Save changes' : 'Add ' + def.singular.toLowerCase()),
        el('button', { type: 'button', class: 'btn', onclick: () => { editing = null; render(); } }, 'Cancel'),
        deleteBtn));

    async function onSubmit(e) {
      e.preventDefault();
      const data = new FormData(e.currentTarget);
      const next = {};
      const errors = {};

      for (const f of def.fields) {
        if (f.type === 'checks') { next[f.k] = data.getAll(f.k); continue; }
        const raw = (data.get(f.k) ?? '').toString().trim();
        if (f.required && !raw) errors[f.k] = f.label + ' is required';
        if (f.type === 'number' && raw !== '') {
          const n = Number(raw);
          if (Number.isNaN(n)) errors[f.k] = 'Must be a number';
          else next[f.k] = n;
        } else if (raw !== '') next[f.k] = raw;
      }

      if (Object.keys(errors).length) {
        editing.values = { ...editing.values, ...next };
        editing.errors = errors;
        render();
        return;
      }

      const res = await saveRecord(editing.section, editing.id, next);
      if (!res.ok) { toast(res.error); return; }
      toast(def.singular + (editing.id ? ' saved' : ' added') + (res.offline ? ' — not stored, this view cannot save' : ''));
      editing = null;
      render();
    }
  }

  /* ==================================================================
   * Shell
   * ================================================================ */

  function go(next) {
    view = next;
    editing = null;
    search = '';
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function syncVenuePicker() {
    const pick = document.getElementById('venuePick');
    if (pick && pick.value !== venue) pick.value = venue;
  }

  function buildVenuePicker() {
    const pick = document.getElementById('venuePick');
    // One venue needs no switcher, and the divider that sets it off would
    // then read as a dangling rule, so that goes with it.
    if (VENUES.length < 2) {
      for (const id of ['venuePick', 'venuePickLabel']) {
        const node = document.getElementById(id);
        if (node) node.style.display = 'none';
      }
      const divider = document.querySelector('.topDivider');
      if (divider) divider.style.display = 'none';
      return;
    }
    pick.replaceChildren(...VENUES.map((v) => el('option', { value: v.id }, v.name)));
    pick.value = venue;
    pick.addEventListener('change', (e) => {
      venue = e.target.value;
      editing = null;
      search = '';
      assist = { busy: false, text: '', question: '' };
      render();
    });
  }

  function renderNav() {
    document.getElementById('navTop').replaceChildren(
      navBtn('dashboard', 'Dashboard'),
      navBtn('venues', 'Venue'));

    document.getElementById('navRecords').replaceChildren(
      ...SECTIONS.map((s) => navBtn(s, SCHEMA[s].title, forVenue(s).length || null)));
  }

  function navBtn(key, label, count) {
    return el('button', { class: 'railBtn', 'aria-current': view === key, onclick: () => go(key) },
      el('span', null, label),
      count ? el('span', { class: 'n' }, count) : null);
  }

  function paint() {
    const main = document.getElementById('main');
    const active = document.activeElement;
    const isSearch = active && active.id && active.id.startsWith('search-');
    const caret = isSearch ? active.selectionStart : null;
    const activeId = isSearch ? active.id : null;

    const content = view === 'dashboard' ? dashboard()
      : view === 'venues' ? venuesView()
      : recordsView(view);

    main.replaceChildren(...content.flat(5).filter(Boolean));

    if (activeId) {
      const again = document.getElementById(activeId);
      if (again) {
        again.focus();
        try { again.setSelectionRange(caret, caret); } catch { /* not a text input */ }
      }
    }
  }

  function render() {
    renderNav();
    const label = document.getElementById('dbState');
    if (label) {
      label.textContent = dbState === 'ready' ? 'Shared workspace'
        : dbState === 'local' ? 'Saved in this browser'
        : dbState === 'offline' ? 'Not saving' : 'connecting…';
      label.style.color = dbState === 'offline' ? 'var(--brand)' : 'var(--bar-dim)';
    }
    paint();
  }

  buildVenuePicker();
  render();
  connect();

  window.addEventListener('beforeunload', () => {
    for (const stop of subs) { try { stop(); } catch { /* already gone */ } }
  });
})();
</script>
</body>
</html>

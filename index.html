  function levelSpec() {
    return {
      title: 'Level 1 blocks',
      subtitle: 'FNB Stadium · ' + BLOCK_IDS.length + ' blocks · '
        + numFmt(BLOCK_IDS.reduce((s, b) => s + MAP[b].seats, 0)) + ' seats · source: '
        + LEVEL1_SOURCE + ' · generated ' + stamp(),
      columns: [
        { key: 'block', label: 'Block', numeric: true, get: (r) => r.block },
        { key: 'seats', label: 'Seats', numeric: true, get: (r) => r.seats },
        { key: 'rows', label: 'Rows', numeric: true, get: (r) => r.rowCount },
        { key: 'back', label: 'Back row', get: (r) => r.rows[0][0] },
        { key: 'front', label: 'Front row', get: (r) => r.rows[r.rows.length - 1][0] },
        { key: 'widest', label: 'Widest row', numeric: true, get: (r) => r.widest },
        { key: 'mean', label: 'Mean seats per row', numeric: true, get: (r) => Math.round(r.mean) },
      ],
      rows: BLOCK_IDS.map((b) => MAP[b]),
    };
  }

  function seatMapView() {
    const v = venueById.get(venue);
    const totalSeats = BLOCK_IDS.reduce((s, b) => s + MAP[b].seats, 0);
    const totalRows = BLOCK_IDS.reduce((s, b) => s + MAP[b].rowCount, 0);
    const biggest = BLOCK_IDS.slice().sort((a, b) => MAP[b].seats - MAP[a].seats)[0];
    const smallest = BLOCK_IDS.slice().sort((a, b) => MAP[a].seats - MAP[b].seats)[0];
    const open = seatBlock ? MAP[seatBlock] : null;

    const out = [
      head('Level 1 · ' + v.name, open ? 'Block ' + seatBlock : 'Seating bowl',
        open
          ? numFmt(open.seats) + ' seats across ' + open.rowCount + ' rows, '
            + open.rows[open.rows.length - 1][0] + ' at the front to ' + open.rows[0][0]
            + ' at the back. ' + SEAT_ONE + '. Scroll to zoom, drag to move.'
          : 'Blocks 101 to 150 as recorded in SMSA’s seating schedule — '
            + numFmt(totalSeats) + ' seats over ' + numFmt(totalRows)
            + ' rows. Click a block to open it seat by seat.',
        [
          exportBar(() => (open ? seatMapSpec(seatBlock) : levelSpec())),
          open ? el('button', { class: 'btn primary', onclick: () => { seatBlock = null; mapCam = null; render(); } }, 'Back to the bowl') : null,
        ]),
    ];

    if (!open) {
      out.push(el('div', { class: 'tiles' },
        tile('Blocks', BLOCK_IDS.length, '101 to 150'),
        tile('Seats', numFmt(totalSeats), 'every one on the schedule'),
        tile('Rows', numFmt(totalRows), 'across the level'),
        tile('Largest block', String(biggest), numFmt(MAP[biggest].seats) + ' seats'),
        tile('Smallest block', String(smallest), numFmt(MAP[smallest].seats) + ' seats')));
    }

    const wrap = el('div', { class: 'mapWrap', style: 'margin-top:14px' });
    const drawing = open ? drawBlock(seatBlock) : drawBowl();
    wrap.append(drawing.svg);

    const cam = wireCamera(drawing.svg, drawing.scene, open ? 'block-' + seatBlock : 'bowl');

    wrap.append(el('div', { class: 'mapBar' },
      open ? null : rampKey(),
      el('div', { class: 'mapZoom' },
        el('button', { class: 'btn sm', onclick: () => cam.zoom(1.3), title: 'Zoom in' }, '+'),
        el('button', { class: 'btn sm', onclick: () => cam.zoom(1 / 1.3), title: 'Zoom out' }, '−'),
        el('button', { class: 'btn sm', onclick: cam.reset }, 'Fit'))));
    out.push(wrap);

    out.push(el('div', { class: 'notice info', style: 'margin-top:12px' },
      el('strong', null, 'Seat counts are SMSA’s; the shape is derived. '),
      'Every row label and seat count comes from the Level 1 sticker schedule and reconciles '
      + 'exactly with its summary. The schedule carries no survey coordinates, so each block’s '
      + 'width follows its mean row width and its depth follows its row count — drawn area '
      + 'tracks seats, and the running order matches the ticketing map. Use it to find a seat, '
      + 'not to measure the building.'));

    if (open) {
      out.push(el('div', { class: 'sectionTitle' }, 'Rows in block ' + seatBlock));
      out.push(el('div', { class: 'panel' }, el('div', { class: 'tw' },
        el('table', null,
          el('thead', null, el('tr', null,
            el('th', null, 'Row'), el('th', { class: 'num' }, 'Seats'),
            el('th', null, 'Numbering'), el('th', { class: 'num' }, 'Running total'))),
          el('tbody', null, (() => {
            let run = 0;
            return open.rows.map(([label, qty]) => {
              run += qty;
              return el('tr', null,
                el('td', null, el('span', { class: 'code strong' }, label)),
                el('td', { class: 'num' }, qty),
                el('td', null, tiny('1 – ' + qty)),
                el('td', { class: 'num' }, numFmt(run)));
            });
          })())))));
      return out;
    }

    out.push(el('div', { class: 'sectionTitle' }, 'Every block'));
    const term = search.trim().toLowerCase();
    const listed = BLOCK_IDS.filter((b) => !term || String(b).includes(term));
    out.push(el('div', { class: 'toolbar' },
      el('input', {
        class: 'search', type: 'search', id: 'search-seatmap',
        placeholder: 'Jump to a block…', value: search,
        oninput: (e) => { search = e.target.value; paint(); },
      }),
      el('span', { class: 'count' },
        listed.length === BLOCK_IDS.length ? BLOCK_IDS.length + ' blocks' : listed.length + ' of ' + BLOCK_IDS.length)));

    out.push(el('div', { class: 'panel' }, el('div', { class: 'tw' },
      el('table', null,
        el('thead', null, el('tr', null,
          el('th', null, 'Block'), el('th', { class: 'num' }, 'Seats'), el('th', { class: 'num' }, 'Rows'),
          el('th', null, 'Front → back'), el('th', { class: 'num' }, 'Widest row'),
          el('th', { class: 'num' }, 'Mean per row'), el('th', null, ''))),
        el('tbody', null, listed.length === 0
          ? el('tr', null, el('td', { colspan: 7 },
              el('div', { class: 'muted', style: 'padding:20px;text-align:center' }, 'No block matches “' + search + '”.')))
          : listed.map((b) => {
              const g = MAP[b];
              return el('tr', null,
                el('td', null, el('span', { class: 'code strong' }, String(b))),
                el('td', { class: 'num' }, numFmt(g.seats)),
                el('td', { class: 'num' }, g.rowCount),
                el('td', null, tiny(g.rows[g.rows.length - 1][0] + ' → ' + g.rows[0][0])),
                el('td', { class: 'num' }, g.widest),
                el('td', { class: 'num' }, Math.round(g.mean)),
                el('td', { class: 'tight' },
                  el('div', { class: 'rowBtns' },
                    el('button', { class: 'btn sm', onclick: () => { seatBlock = b; mapCam = null; search = ''; render(); } }, 'Open'))));
            }))))));

    return out;
  }

  /* ---------- history ---------- */

  const todayISO = () => new Date().toISOString().slice(0, 10);
  const yearOf = (e) => String(e.date || '').slice(0, 4) || '\u2014';

  /** An event is history once its date has passed, or once it has been
   *  closed or reconciled — a cancelled-and-settled fixture belongs in
   *  the record even if its date has not arrived. */
  function pastEvents() {
    const now = todayISO();
    return forVenue('events')
      .filter((e) => e.date && (e.date < now || e.status === 'closed' || e.status === 'reconciled'))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }

  function dayName(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T12:00:00');
    return Number.isNaN(d.getTime()) ? '' : new Intl.DateTimeFormat('en-ZA', { weekday: 'long' }).format(d);
  }

  /** Gates-to-end running time. Events that finish after midnight are
   *  common here, so a negative span wraps rather than reading as a
   *  nonsense negative duration. */
  function runningTime(e) {
    if (!e.start || !e.ends) return null;
    const parts = [e.start, e.ends].map((s) => s.split(':').map(Number));
    if (parts.some(([h, m]) => Number.isNaN(h) || Number.isNaN(m))) return null;
    let mins = (parts[1][0] * 60 + parts[1][1]) - (parts[0][0] * 60 + parts[0][1]);
    if (mins < 0) mins += 24 * 60;
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0') + 'm';
  }

  const fillPct = (e, cap) => (e.attendance && cap ? Math.round((Number(e.attendance) / cap) * 100) : null);

  function historyColumns() {
    const cap = venueById.get(venue).capacity;
    return [
      { key: 'year', label: 'Year', get: (e) => yearOf(e) },
      { key: 'name', label: 'Event', get: (e) => e.name || '' },
      { key: 'code', label: 'Reference', get: (e) => e.code || '' },
      { key: 'kind', label: 'Type', get: (e) => optLabel('events', 'kind', e.kind) },
      { key: 'date', label: 'Date', get: (e) => e.date || '' },
      { key: 'day', label: 'Day', get: (e) => dayName(e.date) },
      { key: 'doors', label: 'Gates open', get: (e) => e.doors || '' },
      { key: 'start', label: 'Start', get: (e) => e.start || '' },
      { key: 'ends', label: 'Ends', get: (e) => e.ends || '' },
      { key: 'running', label: 'Running time', get: (e) => runningTime(e) || '' },
      { key: 'attendance', label: 'Attendance', numeric: true, get: (e) => (e.attendance ? Number(e.attendance) : '') },
      { key: 'fill', label: '% of capacity', numeric: true, get: (e) => fillPct(e, cap) ?? '' },
      { key: 'status', label: 'Stage', get: (e) => optLabel('events', 'status', e.status) },
      { key: 'notes', label: 'Notes', get: (e) => e.notes || '' },
    ];
  }

  function historySpec(rows, all) {
    const v = venueById.get(venue);
    return {
      title: 'Event history',
      subtitle: v.name + ' \u00b7 ' + (rows.length === all.length
        ? rows.length + ' events'
        : rows.length + ' of ' + all.length + ' events, filtered by \u201c' + search.trim() + '\u201d')
        + ' \u00b7 generated ' + stamp(),
      columns: historyColumns(),
      rows,
    };
  }

  function historyView() {
    const v = venueById.get(venue);
    const all = pastEvents();
    const term = search.trim().toLowerCase();
    const rows = term
      ? all.filter((e) => [e.name, e.code, e.kind, yearOf(e), e.date].join(' ').toLowerCase().includes(term))
      : all;

    const out = [
      head('Records \u00b7 ' + v.name, 'Event history',
        'Every event that has already run, with its gate figures and what it filled. Search by name, reference, type or year; open one for the full record.',
        [
          all.length ? exportBar(() => historySpec(rows, all)) : null,
          el('button', { class: 'btn ghost', onclick: loadPublicRecord }, 'Load public record'),
        ]),
    ];

    if (all.length === 0) {
      out.push(el('div', { class: 'empty' },
        el('div', { class: 'emptyTitle' }, 'No past events on record'),
        el('div', { class: 'emptyBody' },
          'Events move here on their own once their date has passed, or as soon as you mark one closed or reconciled. '
          + 'You can enter previous seasons under Events, or load what this stadium is publicly recorded as having hosted \u2014 '
          + 'twenty events from 1990 to 2019, each carrying its source, to reconcile against SMSA\u2019s own returns.'),
        el('div', { style: 'display:flex;gap:7px;justify-content:center;flex-wrap:wrap' },
          el('button', { class: 'btn primary', onclick: loadPublicRecord }, 'Load the public record'),
          el('button', { class: 'btn', onclick: () => go('events') }, 'Enter one by hand'))));
      return out;
    }

    const withGate = all.filter((e) => Number(e.attendance) > 0);
    const totalGate = withGate.reduce((s, e) => s + Number(e.attendance), 0);
    const meanFill = withGate.length
      ? Math.round(withGate.reduce((s, e) => s + (Number(e.attendance) / v.capacity) * 100, 0) / withGate.length)
      : null;
    const biggest = withGate.slice().sort((a, b) => Number(b.attendance) - Number(a.attendance))[0];
    const years = [...new Set(all.map(yearOf))].sort().reverse();

    out.push(el('div', { class: 'tiles' },
      tile('Events run', all.length, years.length + (years.length === 1 ? ' year' : ' years') + ' on record'),
      tile('Total attendance', totalGate ? numFmt(totalGate) : '\u2014',
        withGate.length ? 'across ' + withGate.length + ' events with gate figures' : 'no gate figures entered'),
      tile('Average fill', meanFill != null ? meanFill + '%' : '\u2014',
        meanFill != null ? 'of ' + numFmt(v.capacity) + ' seats' : 'needs attendance figures',
        meanFill == null ? null : meanFill >= 80 ? 'good' : meanFill >= 50 ? 'warn' : 'crit'),
      tile('Best attended', biggest ? numFmt(biggest.attendance) : '\u2014',
        biggest ? biggest.name + ' \u00b7 ' + fmtDate(biggest.date) : 'no gate figures entered')));

    // Attendance by year — one bar per year, each directly labelled.
    const byYear = new Map();
    for (const e of all) {
      const y = yearOf(e);
      const agg = byYear.get(y) || { year: y, events: [], gate: 0 };
      agg.events.push(e);
      agg.gate += Number(e.attendance) || 0;
      byYear.set(y, agg);
    }
    const yearRows = years.map((y) => byYear.get(y));

    if (totalGate > 0) {
      out.push(el('div', { class: 'sectionTitle' }, 'Attendance by year'));
      out.push(el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
        barChart(yearRows.map((a) => ({
          label: a.year,
          sub: a.events.length + (a.events.length === 1 ? ' event' : ' events'),
          value: a.gate,
          // A year whose events have no published gate is unknown, not
          // zero. Printing 0 beside three events says nobody came.
          display: a.gate ? numFmt(a.gate) : 'not published',
        }))))));
    }

    // Which kinds of event actually fill the bowl. A concert that sells
    // 55 000 and a derby that sells 94 000 are different businesses, and
    // averaging them together hides that.
    const byKind = new Map();
    for (const e of withGate) {
      const k = e.kind || 'other';
      const agg = byKind.get(k) || { kind: k, n: 0, gate: 0, best: 0 };
      agg.n++;
      agg.gate += Number(e.attendance);
      agg.best = Math.max(agg.best, Number(e.attendance));
      byKind.set(k, agg);
    }
    const kindRows = [...byKind.values()].sort((a, b) => (b.gate / b.n) - (a.gate / a.n));

    if (kindRows.length > 1) {
      out.push(el('div', { class: 'sectionTitle' }, 'How each kind of event fills the bowl'));
      out.push(el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
        barChart(kindRows.map((a) => {
          const avg = Math.round(a.gate / a.n);
          return {
            label: optLabel('events', 'kind', a.kind),
            sub: a.n + (a.n === 1 ? ' event' : ' events') + ' \u00b7 best ' + numFmt(a.best),
            value: avg,
            display: numFmt(avg) + ' \u00b7 ' + Math.round((avg / v.capacity) * 100) + '%',
            colour: 'var(--viz-2)',
          };
        })),
        el('div', { class: 'legend' },
          el('span', null, 'Bar length is the average crowd; the percentage is that against ' + numFmt(v.capacity) + ' seats.')))));
    }

    // Which days actually sell. Useful when a promoter asks for a Tuesday.
    const byDay = new Map();
    for (const e of all) {
      const d = dayName(e.date);
      if (!d) continue;
      const agg = byDay.get(d) || { day: d, n: 0, gate: 0, gated: 0 };
      agg.n++;
      if (Number(e.attendance) > 0) { agg.gate += Number(e.attendance); agg.gated++; }
      byDay.set(d, agg);
    }
    const dayRows = [...byDay.values()].sort((a, b) => b.n - a.n);

    if (dayRows.length > 1) {
      out.push(el('div', { class: 'sectionTitle' }, 'Which days this ground runs on'));
      out.push(el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
        barChart(dayRows.map((a) => ({
          label: a.day,
          sub: a.gated ? 'average ' + numFmt(Math.round(a.gate / a.gated)) : 'no gate figures',
          value: a.n,
          display: a.n + (a.n === 1 ? ' event' : ' events'),
          colour: 'var(--viz-3)',
        }))))));
    }

    out.push(el('div', { class: 'sectionTitle' }, 'By year'));
    out.push(el('div', { class: 'venueGrid' }, yearRows.map((a) => {
      const gated = a.events.filter((e) => Number(e.attendance) > 0);
      const avg = gated.length ? Math.round(a.gate / gated.length) : null;
      return el('div', { class: 'venueCard' },
        el('div', { class: 'venueStripe' }),
        el('div', { class: 'venueBody' },
          el('div', { class: 'venueName' }, a.year),
          el('div', { class: 'venueMeta' }, a.events.length + (a.events.length === 1 ? ' event' : ' events')),
          el('div', { class: 'venueCapLabel', style: 'margin-top:9px' }, 'Total attendance'),
          el('div', { class: 'venueCap' }, a.gate ? numFmt(a.gate) : '\u2014'),
          el('div', { class: 'venueMeta', style: 'margin-top:6px' },
            !gated.length ? 'no gate figures'
              : gated.length > 1 ? 'average ' + numFmt(avg) + ' an event'
              : gated[0].name)));
    })));

    out.push(el('div', { class: 'sectionTitle' }, 'Every event'));
    out.push(el('div', { class: 'toolbar' },
      el('input', {
        class: 'search', type: 'search', id: 'search-history',
        placeholder: 'Search by name, reference, type or year\u2026', value: search,
        oninput: (e) => { search = e.target.value; paint(); },
      }),
      el('span', { class: 'count' },
        rows.length === all.length ? all.length + ' events' : rows.length + ' of ' + all.length)));

    const body = rows.length === 0
      ? el('tr', null, el('td', { colspan: 7 },
          el('div', { class: 'muted', style: 'padding:20px;text-align:center' }, 'Nothing matches \u201c' + search + '\u201d.')))
      : rows.map((e) => {
          const pct = fillPct(e, v.capacity);
          return el('tr', null,
            el('td', null, el('span', { class: 'code strong' }, yearOf(e))),
            el('td', null, twoLine(e.name, e.code)),
            el('td', null, el('span', null, fmtDate(e.date),
              el('div', { class: 'tiny muted code' }, [dayName(e.date), e.start].filter(Boolean).join(' \u00b7 ')))),
            el('td', null, tiny(optLabel('events', 'kind', e.kind))),
            el('td', { class: 'num' }, e.attendance ? numFmt(e.attendance) : dash()),
            el('td', { class: 'num' }, pct != null ? pct + '%' : dash()),
            el('td', { class: 'tight' }, pill(EVENT_TONE[e.status] || 'neutral', optLabel('events', 'status', e.status))),
            el('td', { class: 'tight' },
              el('div', { class: 'rowBtns' },
                el('button', { class: 'btn sm', onclick: () => go('event:' + e.id) }, 'Open'))));
        });

    out.push(el('div', { class: 'panel' },
      el('div', { class: 'tw' },
        el('table', null,
          el('thead', null, el('tr', null,
            ['Year', 'Event', 'Date', 'Type'].map((h) => el('th', null, h)),
            el('th', { class: 'num' }, 'Attendance'),
            el('th', { class: 'num' }, 'Filled'),
            el('th', null, 'Stage'),
            el('th', null, ''))),
          el('tbody', null, body)))));

    return out;
  }

  /* ---------- one event ---------- */

  function eventSpec(e) {
    const v = venueById.get(venue);
    const cols = historyColumns();
    return {
      title: e.name || 'Event',
      subtitle: v.name + ' \u00b7 ' + fmtDate(e.date) + ' \u00b7 generated ' + stamp(),
      // Transposed: one record reads as field-and-value down the page,
      // not as a single row running off the side of it.
      columns: [
        { key: 'field', label: 'Field', get: (r) => r.label },
        { key: 'value', label: 'Value', get: (r) => r.value },
      ],
      rows: cols
        .map((c) => ({ label: c.label, value: c.get(e) }))
        .filter((r) => r.value !== '' && r.value != null),
    };
  }

  function eventView(id) {
    const v = venueById.get(venue);
    const e = store.events.find((x) => x.id === id);

    if (!e) {
      return [head('Event', 'Not on record',
        'That event has been deleted, or it belongs to a different venue.',
        el('button', { class: 'btn primary', onclick: () => go('history') }, 'Back to history'))];
    }

    const pct = fillPct(e, v.capacity);
    const run = runningTime(e);
    const past = e.date && e.date < todayISO();

    const rows = [
      ['Event', e.name],
      e.code ? ['Reference', e.code] : null,
      ['Type', optLabel('events', 'kind', e.kind)],
      ['Venue', v.name + ' \u00b7 ' + v.suburb],
      ['Date', fmtDate(e.date) + (dayName(e.date) ? ' (' + dayName(e.date) + ')' : '')],
      e.doors ? ['Gates open', e.doors] : null,
      e.start ? ['Start', e.start] : null,
      e.ends ? ['Ends', e.ends] : null,
      run ? ['Running time', run] : null,
      e.attendance ? ['Attendance', numFmt(e.attendance)] : null,
      pct != null ? ['Share of capacity', pct + '% of ' + numFmt(v.capacity) + ' seats'] : null,
      ['Stage', optLabel('events', 'status', e.status)],
    ].filter(Boolean);

    return [
      head(past ? 'Event history \u00b7 ' + yearOf(e) : 'Event \u00b7 ' + yearOf(e), e.name || 'Event',
        [optLabel('events', 'kind', e.kind), fmtDate(e.date), v.name].filter(Boolean).join(' \u00b7 '),
        [
          exportBar(() => eventSpec(e)),
          el('button', { class: 'btn ghost', onclick: () => go(past ? 'history' : 'events') }, 'Back'),
          el('button', { class: 'btn ghost', onclick: () => cloneEvent(e) }, 'Book again'),
          el('button', { class: 'btn primary', onclick: () => { view = 'events'; openForm('events', e); } }, 'Edit'),
        ]),

      el('div', { class: 'tiles' },
        tile('Attendance', e.attendance ? numFmt(e.attendance) : '\u2014',
          e.attendance ? 'through the gates' : 'not recorded'),
        tile('Share of capacity', pct != null ? pct + '%' : '\u2014',
          pct != null ? 'of ' + numFmt(v.capacity) + ' seats' : 'needs an attendance figure',
          pct == null ? null : pct >= 80 ? 'good' : pct >= 50 ? 'warn' : 'crit'),
        tile('Running time', run || '\u2014', run ? e.start + ' to ' + e.ends : 'needs a start and an end'),
        tile('Stage', optLabel('events', 'status', e.status), past ? 'event has run' : 'still ahead')),

      el('div', { class: 'sectionTitle' }, 'The record'),
      el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
        el('dl', { class: 'dl' }, rows.map(([k, val]) => [el('dt', null, k), el('dd', null, val)])))),

      e.notes
        ? [el('div', { class: 'sectionTitle' }, 'Notes'),
           el('div', { class: 'panel' }, el('div', { class: 'panelBody' },
             el('div', { style: 'white-space:pre-wrap;font-size:12.5px' }, e.notes)))]
        : null,
    ];
  }

  /**
   * Book a past fixture again.
   *
   * Annual events are most of this ground's calendar, and re-typing a
   * derby's gates, kick-off and running time every July is how a wrong
   * time reaches a crew. This carries the shape forward and clears what
   * must not be inherited: the reference, the gate figure, and the stage.
   */
  function cloneEvent(e) {
    const next = { ...e };
    delete next.id;
    delete next.code;
    delete next.attendance;
    delete next.updatedAt;
    delete next.createdAt;

    // Roll forward to the next time this date comes round, not to the year
    // after whichever one you happened to open. Cloning the 2015 derby
    // should offer next season, not a date eleven years gone.
    if (next.date) {
      const d = new Date(next.date + 'T12:00:00');
      if (!Number.isNaN(d.getTime())) {
        const now = new Date();
        do { d.setFullYear(d.getFullYear() + 1); } while (d <= now);
        next.date = d.toISOString().slice(0, 10);
      }
    }
    next.status = 'planned';

    view = 'events';
    lastList = 'events';
    search = '';
    editing = { section: 'events', id: null, values: next, errors: {} };
    render();
    toast('Same event, a year on \u2014 check the date and give it a reference.');
  }

  /* ---------- records ---------- */

  function recordsView(sec) {
    const def = SCHEMA[sec];
    const order = sorting[sec];
    const all = forVenue(sec).sort(order ? compareBy(order.key, order.dir) : def.sort);
    const term = search.trim().toLowerCase();
    const rows = term ? all.filter((r) => def.search(r).toLowerCase().includes(term)) : all;
    const v = venueById.get(venue);

    const out = [
      head('Records · ' + v.name, def.title, def.blurb,
        [
          (sec === 'kiosks' || sec === 'storage' || sec === 'crews') && all.length === 0
            ? el('button', { class: 'btn ghost', onclick: loadStarter }, 'Build starter layout')
            : null,
          sec === 'events'
            ? el('button', { class: 'btn ghost', onclick: loadPublicRecord }, 'Load public record')
            : null,
          el('button', { class: 'btn primary', onclick: () => openForm(sec, null) }, 'New ' + def.singular.toLowerCase()),
        ]),
    ];

    if (editing && editing.section === sec) out.push(renderForm());

    if (all.length === 0 && !editing) {
      out.push(el('div', { class: 'empty' },
        el('div', { class: 'emptyTitle' }, 'No ' + def.title.toLowerCase() + ' at ' + v.name),
        el('div', { class: 'emptyBody' }, def.empty),
        el('div', { style: 'display:flex;gap:7px;justify-content:center;flex-wrap:wrap' },
          el('button', { class: 'btn primary', onclick: () => openForm(sec, null) }, 'Add the first ' + def.singular.toLowerCase()),
          (sec === 'kiosks' || sec === 'storage' || sec === 'crews')
            ? el('button', { class: 'btn', onclick: loadStarter }, 'Build a starter layout instead')
            : null,
          sec === 'events'
            ? el('button', { class: 'btn', onclick: loadPublicRecord }, 'Load this stadium\u2019s public record')
            : null)));
      return out;
    }

    if (all.length > 0) {
      out.push(el('div', { class: 'toolbar' },
        el('input', {
          class: 'search', type: 'search', id: 'search-' + sec,
          placeholder: 'Search ' + def.title.toLowerCase() + '…', value: search,
          oninput: (e) => { search = e.target.value; paint(); },
        }),
        el('span', { class: 'count' }, rows.length === all.length ? all.length + ' records' : rows.length + ' of ' + all.length),
        exportBar(() => ({
          title: def.title,
          subtitle: v.name + ' \u00b7 ' + (rows.length === all.length
            ? rows.length + ' ' + def.title.toLowerCase()
            : rows.length + ' of ' + all.length + ', filtered by \u201c' + search.trim() + '\u201d')
            + ' \u00b7 generated ' + stamp(),
          columns: exportColumns(sec),
          rows,
        }))));

      const header = el('tr', null,
        def.columns.map((c, i) => {
          const key = (SORT_KEYS[sec] || [])[i];
          if (!key) return el('th', { class: c.class === 'num' ? 'num' : null }, c.label);
          const active = order && order.key === key;
          return el('th', {
            class: (c.class === 'num' ? 'num ' : '') + 'sortable',
            'aria-sort': active ? (order.dir === 'asc' ? 'ascending' : 'descending') : 'none',
            title: 'Sort by ' + c.label.toLowerCase(),
            onclick: () => {
              // Ascending, then descending, then back to the section's own order.
              if (!active) sorting[sec] = { key, dir: 'asc' };
              else if (order.dir === 'asc') sorting[sec] = { key, dir: 'desc' };
              else delete sorting[sec];
              paint();
            },
          }, c.label, active ? el('span', { class: 'caret' }, order.dir === 'asc' ? '\u25b2' : '\u25bc') : null);
        }),
        el('th', null, ''));

      const body = rows.length === 0
        ? el('tr', null, el('td', { colspan: def.columns.length + 1 },
            el('div', { class: 'muted', style: 'padding:20px;text-align:center' }, 'Nothing matches “' + search + '”.')))
        : rows.map((r) => el('tr', null,
            def.columns.map((c) => el('td', { class: c.class || null }, c.render(r))),
            el('td', { class: 'tight' },
              el('div', { class: 'rowBtns' },
                sec === 'events'
                  ? el('button', { class: 'btn sm', onclick: () => go('event:' + r.id) }, 'Open')
                  : null,
                el('button', { class: 'btn sm', onclick: () => openForm(sec, r) }, 'Edit')))));

      out.push(el('div', { class: 'panel' },
        el('div', { class: 'tw' },
          el('table', null,
            el('thead', null, header),
            el('tbody', null, body)))));
    }

    return out;
  }

  /* ---------- form ---------- */

  function openForm(sec, record) {
    editing = { section: sec, id: record ? record.id : null, values: record ? { ...record } : formDefaults(sec), errors: {} };
    render();
    const first = document.querySelector('.formBody input, .formBody select');
    if (first) first.focus();
  }

  function formDefaults(sec) {
    const out = {};
    for (const f of SCHEMA[sec].fields) {
      if (f.type === 'select' && f.options.length) out[f.k] = f.options[0][0];
      if (f.type === 'checks') out[f.k] = [];
    }
    return out;
  }

  function renderForm() {
    const def = SCHEMA[editing.section];
    const values = editing.values;

    const fields = def.fields.map((f) => {
      const id = 'f-' + editing.section + '-' + f.k;
      const err = editing.errors[f.k];
      let input;

      if (f.type === 'select') {
        input = el('select', { id, name: f.k },
          f.options.map(([val, label]) => el('option', { value: val, selected: String(values[f.k] ?? '') === val }, label)));
      } else if (f.type === 'textarea') {
        input = el('textarea', { id, name: f.k, rows: 2 }, values[f.k] || '');
      } else if (f.type === 'checks') {
        const held = new Set(values[f.k] || []);
        input = el('div', { class: 'checks' }, f.options.map(([val, label]) =>
          el('label', { class: 'check' },
            el('input', { type: 'checkbox', name: f.k, value: val, checked: held.has(val) }), label)));
      } else {
        input = el('input', { id, name: f.k, type: f.type, step: f.step, placeholder: f.placeholder, value: values[f.k] ?? '' });
      }

      return el('div', { class: 'field' + (f.wide ? ' wide' : '') + (err ? ' err' : '') },
        el('label', { for: f.type === 'checks' ? null : id }, f.label + (f.required ? ' *' : '')),
        input,
        err ? el('div', { class: 'errMsg' }, err) : f.hint ? el('div', { class: 'hint' }, f.hint) : null);
    });

    const deleteBtn = editing.id
      ? el('button', {
          type: 'button', class: 'btn danger', style: 'margin-left:auto',
          onclick: async () => {
            if (!window.confirm('Delete this ' + def.singular.toLowerCase() + '? This cannot be undone.')) return;
            const res = await deleteRecord(editing.section, editing.id);
            if (res.ok) { toast(def.singular + ' deleted'); editing = null; render(); }
            else toast(res.error);
          },
        }, 'Delete')
      : null;

    return el('form', { class: 'panel formWrap', onsubmit: onSubmit },
      el('div', { class: 'formHead' },
        el('span', { class: 'panelTitle' }, (editing.id ? 'Edit ' : 'New ') + def.singular.toLowerCase() + ' · ' + venueById.get(venue).name),
        el('button', { type: 'button', class: 'btn sm', onclick: () => { editing = null; render(); } }, 'Close')),
      el('div', { class: 'formBody' }, fields),
      el('div', { class: 'formFoot' },
        el('button', { type: 'submit', class: 'btn primary' }, editing.id ? 'Save changes' : 'Add ' + def.singular.toLowerCase()),
        el('button', { type: 'button', class: 'btn', onclick: () => { editing = null; render(); } }, 'Cancel'),
        deleteBtn));

    async function onSubmit(e) {
      e.preventDefault();
      const data = new FormData(e.currentTarget);
      const next = {};
      const errors = {};

      for (const f of def.fields) {
        if (f.type === 'checks') { next[f.k] = data.getAll(f.k); continue; }
        const raw = (data.get(f.k) ?? '').toString().trim();
        if (f.required && !raw) errors[f.k] = f.label + ' is required';
        if (f.type === 'number' && raw !== '') {
          const n = Number(raw);
          if (Number.isNaN(n)) errors[f.k] = 'Must be a number';
          else next[f.k] = n;
        } else if (raw !== '') next[f.k] = raw;
      }

      if (Object.keys(errors).length) {
        editing.values = { ...editing.values, ...next };
        editing.errors = errors;
        render();
        return;
      }

      const res = await saveRecord(editing.section, editing.id, next);
      if (!res.ok) { toast(res.error); return; }
      toast(def.singular + (editing.id ? ' saved' : ' added') + (res.offline ? ' — not stored, this view cannot save' : ''));
      editing = null;
      render();
    }
  }

  /* ==================================================================
   * Shell
   * ================================================================ */

  function go(next) {
    if (next !== 'seatmap') { seatBlock = null; mapCam = null; }
    if (next === 'history' || next === 'events') lastList = next;
    view = next;
    editing = null;
    search = '';
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function syncVenuePicker() {
    const pick = document.getElementById('venuePick');
    if (pick && pick.value !== venue) pick.value = venue;
  }

  function buildVenuePicker() {
    const pick = document.getElementById('venuePick');
    // One venue needs no switcher, and the divider that sets it off would
    // then read as a dangling rule, so that goes with it.
    if (VENUES.length < 2) {
      for (const id of ['venuePick', 'venuePickLabel']) {
        const node = document.getElementById(id);
        if (node) node.style.display = 'none';
      }
      const divider = document.querySelector('.topDivider');
      if (divider) divider.style.display = 'none';
      return;
    }
    pick.replaceChildren(...VENUES.map((v) => el('option', { value: v.id }, v.name)));
    pick.value = venue;
    pick.addEventListener('change', (e) => {
      venue = e.target.value;
      editing = null;
      search = '';
      assist = { busy: false, text: '', question: '' };
      render();
    });
  }

  function renderNav() {
    document.getElementById('navTop').replaceChildren(
      navBtn('dashboard', 'Dashboard'),
      navBtn('venues', 'Venue'),
      navBtn('seatmap', 'Seat map', BLOCK_IDS.length),
      navBtn('history', 'History', pastEvents().length || null));

    document.getElementById('navRecords').replaceChildren(
      ...SECTIONS.map((s) => navBtn(s, SCHEMA[s].title, forVenue(s).length || null)));
  }

  function navBtn(key, label, count) {
    const onEvent = view.startsWith('event:');
    const current = view === key
      || (onEvent && key === 'history' && lastList === 'history')
      || (onEvent && key === 'events' && lastList === 'events');
    return el('button', { class: 'railBtn', 'aria-current': current, onclick: () => go(key) },
      el('span', null, label),
      count ? el('span', { class: 'n' }, count) : null);
  }

  function paint() {
    const main = document.getElementById('main');
    const active = document.activeElement;
    const isSearch = active && active.id && active.id.startsWith('search-');
    const caret = isSearch ? active.selectionStart : null;
    const activeId = isSearch ? active.id : null;

    const content = view === 'dashboard' ? dashboard()
      : view === 'venues' ? venuesView()
      : view === 'seatmap' ? seatMapView()
      : view === 'history' ? historyView()
      : view.startsWith('event:') ? eventView(view.slice(6))
      : recordsView(view);

    main.replaceChildren(...content.flat(5).filter(Boolean));

    if (activeId) {
      const again = document.getElementById(activeId);
      if (again) {
        again.focus();
        try { again.setSelectionRange(caret, caret); } catch { /* not a text input */ }
      }
    }
  }

  function render() {
    renderNav();
    const label = document.getElementById('dbState');
    if (label) {
      label.textContent = dbState === 'ready' ? 'Shared workspace'
        : dbState === 'local' ? 'Saved in this browser'
        : dbState === 'offline' ? 'Not saving' : 'connecting…';
      label.style.color = dbState === 'offline' ? 'var(--brand)' : 'var(--bar-dim)';
    }
    paint();
  }

  buildVenuePicker();
  render();
  connect();

  window.addEventListener('beforeunload', () => {
    for (const stop of subs) { try { stop(); } catch { /* already gone */ } }
  });
})();
</script>
</body>
</html>
